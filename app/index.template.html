<style>
/* Layout: eine Spalte wie eine Banking-App. Großer Seitentitel, darunter gruppierte Listen
   auf hellen Flächen mit feinen Trennlinien, große Zahlen für Zeit und kcal, Tab-Leiste unten.
   Monochrom; ein ruhiges Grün nur für Aktionen und "vorhanden". Systemschrift (kein Abruf bei Google). */
:root {

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system-headline, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  --r-group: 16px; --r-ctl: 12px;
  --tabbar-h: 60px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --surface: #121513; --surface-2: #1C201D; --ink: #F1F3F1; --muted: #8F9791; --line: #242925;
  --accent: #3DC48F; --accent-ink: #04140D; --accent-soft: #10271D; --brand: #FF9F45; --brand-ink: #1A0E00; --brand-text: #FF9F45; --brand-soft: #2B1A0B; --warn: #E3A94A; --warn-soft: #2A2113; --danger: #FF8A80; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --surface: #121513; --surface-2: #1C201D; --ink: #F1F3F1; --muted: #8F9791; --line: #242925;
  --accent: #3DC48F; --accent-ink: #04140D; --accent-soft: #10271D; --brand: #FF9F45; --brand-ink: #1A0E00; --brand-text: #FF9F45; --brand-soft: #2B1A0B; --warn: #E3A94A; --warn-soft: #2A2113; --danger: #FF8A80; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 640px; margin: 0 auto; padding-block: 8px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; overflow-x: clip; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }

.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; color: var(--ink); flex: none; }

.sec { display: grid; gap: 8px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-inline: 4px; }

.muted { color: var(--muted); } .small { font-size: 0.875rem; } .tiny { font-size: 0.78rem; }

/* Gruppierte Liste (eine Fläche, Zeilen mit Trennlinie) */
.group { background: var(--surface); border-radius: var(--r-group); overflow: hidden; }

/* Suche + Filter */

/* Rezeptkarte in der Liste */

.badge.ok { background: var(--accent-soft); color: var(--accent); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }

/* Knöpfe */
a.btn { text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r-ctl); min-height: 50px; padding: 12px 18px; font-weight: 650; font-size: 1rem; background: var(--ink); color: var(--bg); width: 100%; }
.btn.accent { background: var(--brand); color: var(--brand-ink); }

.checkrow { cursor: pointer; } .checkrow input { width: 22px; height: 22px; accent-color: var(--brand); flex: none; }
.btn.danger { background: none; color: var(--danger); }
.btn svg { width: 20px; height: 20px; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Anleitung beim ersten Gebrauch */

/* Detail */
.hero { display: grid; gap: 10px; }
.hero h1 { margin: 0; font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: var(--r-group); }
.fact { padding: 14px 12px; display: grid; gap: 2px; text-align: center; }

.fact span { font-size: 0.78rem; color: var(--muted); }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 3px; }

.steps li + li::before { content: ""; position: absolute; top: 0; left: 54px; right: 0; height: 1px; background: var(--line); }
.snip { display: flex; gap: 8px; align-items: center; margin: 4px 0 2px; }

.build ol { margin: 0; padding-left: 20px; } .build li { margin: 0 0 10px; line-height: 1.4; } .build li b { font-weight: 650; }

.hero .desc { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cook .stephead { margin: 0 0 6px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.steps .n { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 0.82rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.nutri { display: grid; grid-template-columns: repeat(4, 1fr); }
.nutri div { padding: 12px 8px; text-align: center; display: grid; gap: 2px; }

.labels { display: grid; gap: 10px; padding: 14px 16px; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 0.82rem; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); }
.note { background: var(--warn-soft); color: var(--ink); border-radius: var(--r-group); padding: 12px 14px; font-size: 0.9rem; display: grid; gap: 6px; }
.note.info { background: var(--accent-soft); }
.field { display: grid; gap: 6px; }
.field label { font-size: 0.85rem; color: var(--muted); padding-inline: 4px; }
.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-ctl); padding: 12px 14px; min-height: 48px; font-size: 1rem; outline: none; }
textarea.input { min-height: 140px; resize: vertical; line-height: 1.4; }
.input:focus { border-color: var(--accent); }

/* Einkauf */
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: none; flex: none; display: grid; place-items: center; color: var(--accent-ink); padding: 0; }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.check svg { width: 14px; height: 14px; }
.row.done .title { color: var(--muted); text-decoration: line-through; }
.toggle { position: relative; width: 51px; height: 31px; border-radius: 999px; background: var(--surface-2); border: 0; flex: none; transition: background .15s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--accent); }

/* Tab-Leiste */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; transform: translate3d(0, 0, 0); will-change: transform; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }

/* Blatt von unten (Dialoge) */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 30; display: grid; align-items: end; }
.sheet { background: var(--bg); border-radius: 20px 20px 0 0; max-height: 88vh; overflow-y: auto; padding-block: 10px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; max-width: 640px; width: 100%; margin: 0 auto; }
.sheet:focus { outline: none; }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  background: var(--ink); color: var(--bg); border-radius: 999px; padding: 10px 18px; font-size: 0.92rem; font-weight: 600; max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 40px; height: 40px; color: var(--muted); }
.banner { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--r-group); padding: 12px 14px; border: 1px solid var(--line); }
.banner > svg { width: 24px; height: 24px; flex: none; color: var(--accent); }

a { color: var(--accent); }

/* Dynamic Type: übernimmt die Textgröße aus den iPhone-Einstellungen */
@supports (font: -apple-system-body) { html { font: -apple-system-body; } body { font-size: 1rem; } }
.hello { color: var(--muted); font-size: 0.95rem; margin-top: -14px; padding-inline: 2px; }
.tiles { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); scroll-snap-type: x mandatory; padding-bottom: 2px; }
.tiles::-webkit-scrollbar { display: none; }

.tile .title { font-weight: 650; font-size: 0.95rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

/* Startseite: Woche, Schnellzugriffe, Suche */
.wochen { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.wochen::-webkit-scrollbar { display: none; }
.wkarte { flex: none; width: 280px; scroll-snap-align: start; background: var(--surface); border-radius: var(--r-group); padding: 12px 14px; display: grid; gap: 10px; }

.row .glyph { width: 46px; height: 46px; }

  // Timer: laufen weiter, auch wenn der Kochmodus geschlossen wird; am Ende Ton, Vibration (wo möglich) und Hinweis
  var timerTick = null, audio = null;

    sheet('<h2>So funktioniert die App</h2>' +
      '<div class="seg" role="group" aria-label="Umfang"><button data-a="info-detail" data-v="0" aria-pressed="' + !more + '">Kurz</button><button data-a="info-detail" data-v="1" aria-pressed="' + more + '">Ausführlich</button></div>' +
      '<div class="group glance">' +
      '<div>' + ic("check") + '<span>Deine Rezepte, dein Vorrat und deine Einkaufsliste bleiben auf deinem iPhone.</span></div>' +
      '<div>' + ic("check") + '<span>Kein Konto, keine Werbung, kein Tracking, kein eigener Server.</span></div>' +

      '<div class="group info">' +
      sec("person", "Teilnahme am Test", einwilligungText() + (S.prefs.testEinwilligung ? '<p class="small muted">Eingewilligt am ' + esc(dateDe(Date.parse(S.prefs.testEinwilligung.am))) + '.</p>' : ''), false) +
      sec("jar", "Wo deine Daten liegen",
        '<p>Alles, was du in der App speicherst, liegt nur im Speicher dieses Geräts, im Bereich der App. Niemand sonst kann es sehen, auch nicht die Person, die die App bereitstellt.</p>' +

        '<li>Löschst du die App vom Home-Bildschirm, sind die Daten weg. Deshalb erinnert die App ans Sichern.</li>' +
        '<li>Nur wenn du bei einer Zutat auf „In Open Food Facts suchen“ tippst, geht der Suchbegriff (z. B. „Kashk“) an Open Food Facts in Frankreich. Sonst verlässt nichts dein iPhone, außer du teilst es selbst.</li></ul>', true,
        '<p><b>Technisch:</b> Die Daten liegen in der Browser-Datenbank (IndexedDB) der App. Die App bittet iOS um dauerhaften Speicher, damit nichts automatisch gelöscht wird. Die App vom Home-Bildschirm und Safari haben getrennte Speicher, nutze daher immer das App-Symbol.</p>' +
        '<p><b>Sicherung:</b> Eine JSON-Datei mit Rezepten, Vorrat, Einkaufsliste, eigenen Zuordnungen und Folgen-Status. Beim Laden auf einem anderen Gerät kommen neue Rezepte dazu; bei doppelten gewinnt die neuere Fassung. Die App erinnert an die Sicherung, wenn sich seit mehr als 24 Stunden etwas geändert hat.</p>') +
      sec("share", "Wie Rezepte aus Instagram ankommen",
        '<p>Du entscheidest bei jedem Rezept selbst. Nichts passiert im Hintergrund.</p>' +
        '<ul><li><b>Kurzbefehl „In die Kombüse“:</b> Beim Teilen holt dein iPhone einmal die öffentliche Vorschau des Posts, ohne Anmeldung und ohne Zugriff auf dein Instagram-Konto. Private Konten gehen nicht. Steht ein Blog-Link in der Beschreibung, holt es auch diese Seite. Bei Reels wandelt dein iPhone den Ton selbst in Text um (Apples Spracherkennung auf dem Gerät); das Video wird dafür nur kurz geladen und nirgends gespeichert.</li>' +
        '<li><b>Instagram-Export:</b> Die Datei aus „Deine Informationen herunterladen“ liest die App nur auf diesem Gerät. Es kommen nur neue Rezepte dazu, nichts wird überschrieben.</li>' +
        '<li><b>Bilder oder Ton:</b> Wenn ein Rezept nur auf Bildern oder im Video steht, liest dein iPhone den Text bzw. Ton aus und löscht die Datei danach wieder.</li></ul>', false,
        '<p><b>Reihenfolge, wenn Angaben fehlen:</b> 1. Blog des Creators (strukturierte Rezeptdaten der Seite) · 2. Text auf den Bildern des Posts (Live Text) · 3. Ton aus Instagrams offiziellem Download (Transkription). Danach kommt ein Screenshot als Handarbeit. Die App nimmt immer den sparsamsten Weg zuerst.</p>' +
        '<p><b>Was der Kurzbefehl abruft:</b> die öffentliche Einbettungsseite des Posts, die Instagram für andere Webseiten bereitstellt (Meta Platforms, o. J.). Er schickt den Text über die Adresse an die App. Dabei sind keine Anmeldedaten und keine Cookies im Spiel, und kein fremder Server liegt dazwischen.</p>' +
        '<p><b>Blog-Suche:</b> Die App fragt höchstens sechs Mal beim Blog nach (neueste Beiträge, Titel, Hauptzutaten, Hashtag). Einen Treffer übernimmt sie nur, wenn die Zutaten zur Caption passen.</p>') +
      sec("info", "Regeln von Instagram",
        '<p>Instagram verbietet, Inhalte automatisiert und in großer Menge zu sammeln. Die App tut das nicht:</p>' +
        '<ul><li>Ein Abruf pro Tipp, nur für den Post, den du gerade teilst.</li><li>Keine Anmeldung, kein Konto, keine Beiträge, kein automatisches Folgen. Folgen tippst du selbst in Instagram.</li>' +
        '<li>Die App ist für den privaten Gebrauch. Rezepte gehören den Creators: Bitte nicht öffentlich weiterverbreiten. Beim Teilen hängt die App immer den Link zum Original an.</li>' +
        '<li>Der komplett offizielle Weg ist der Instagram-Export. Er funktioniert immer, auch wenn Instagram etwas ändert.</li></ul>', false,
        '<p><b>Einordnung:</b> Die Nutzungsbedingungen von Instagram (Instagram, o. J.) untersagen sinngemäß, Informationen ohne Erlaubnis automatisiert zu erheben. Gemeint ist vor allem massenhaftes Abgreifen. Ein einzelner, von dir ausgelöster Abruf einer öffentlichen Seite für den privaten Gebrauch ist etwas anderes. Eine Garantie, dass Instagram das immer so sieht, gibt es nicht. Ändert Instagram die Seite, bleiben der Export und Screenshots als Wege.</p>' +
        '<p><b>Urheberrecht:</b> Private Kopien für den eigenen Gebrauch sind erlaubt (§ 53 UrhG). Öffentlich weitergeben solltest du fremde Rezepttexte nicht. Die App speichert deshalb immer die Quelle mit.</p>') +
      sec("sparkle", "Wie die Erkennung funktioniert",
        '<p>Die App erkennt Zutaten, Schritte, Zeit, Portionen und Labels mit festen Regeln und Wörterbüchern, ohne KI-Modell. Das ist schnell, sparsam und läuft offline.</p>' +
        '<ul><li>Fehler sind möglich. Was die App schätzt, steht als „geschätzt“ oder „vorgeschlagen“ dabei.</li><li>Titel und Mengen kannst du jederzeit ändern.</li>' +
        '<li>Englische Zutaten übersetzt ein Wörterbuch. Die Zubereitung übersetzt der Übersetzer Bergamot auf deinem iPhone, nach dem ersten Laden auch ohne Internet. Das Original bleibt gespeichert („Original zeigen“).</li>' +
        '<li>Allergene erkennt die App noch nicht zuverlässig genug und zeigt sie deshalb nicht an. Bei Allergien bitte immer die Zutaten selbst prüfen.</li></ul>', false,
        '<p><b>Was die Regeln erkennen:</b> Überschriften (Zutaten, Zubereitung …), Mengen mit Einheiten, Zeiten, Portionen, Backformen, zweisprachige Captions und Text ohne Zeilenumbrüche. Mengen in Tassen rechnet die App in Gramm oder ml um.</p>' +
        '<p><b>Portionen ohne Angabe:</b> Backblech 20 Stück, Springform 12, Kastenform 12 Scheiben, Muffinblech 12, Brownie-Form 9, Auflaufform 4 Portionen; Smoothie und Porridge 1 Portion; sonst geschätzt aus der Gesamtmenge.</p>' +
        '<p><b>Labels:</b> neun Gruppen (Gang, Ernährung, Zeit, Hauptzutat, Praktisch, Nährwert-Fokus, Aufwand, Küche, Saison). „vegan“ heißt: keine tierische Zutat erkannt. „glutenfrei laut Zutaten“ heißt: keine glutenhaltige Zutat erkannt, keine Garantie.</p>' +
        '<p><b>Übersetzung:</b> Bergamot (Mozilla) übersetzt auf dem iPhone. Übersetzer und Sprachmodell (ca. ' + UEB_MB + ' MB) liegen auf derselben Adresse wie die App und werden einmalig geladen; die Rezepte verlassen das Gerät nicht. Die App setzt die „Sie“-Form in Rezeptsprache um („Die Nudeln kochen“). Bisher: Englisch → Deutsch.</p>') +
      sec("sparkle", "Was die App lernt",

        '<li><b>Deine Korrekturen:</b> Über „Mehr → Rezept bearbeiten“ löschst oder korrigierst du Zutaten und Schritte. Die App merkt sich das als Regel und wendet sie auf alle Rezepte an.</li>' +

        '<ul><li>Stück- und Löffelgewichte sind Richtwerte. Die Ergebnisse sind Näherungen, keine Laborwerte.</li><li>Labels wie „proteinreich“ oder „eisenreich“ folgen den Schwellen der EU-Verordnung über nährwertbezogene Angaben, umgerechnet pro Portion (Europäisches Parlament &amp; Rat der Europäischen Union, 2006).</li>' +

        '<p class="small muted">' + esc(BLS_HINWEIS) + '</p>', false,
        '<p><b>Schwellen pro Portion:</b> proteinreich ab 20 % der Energie aus Eiweiß · ballaststoffreich ab 3 g je 100 kcal · eisenreich ab 4,2 mg · calciumreich ab 240 mg · magnesiumreich ab 112,5 mg · Vitamin-C-reich ab 24 mg (je 30 % der Nährstoffbezugswerte nach Europäisches Parlament &amp; Rat der Europäischen Union, 2011) · Omega-3-reich ab 0,6 g je 100 kcal.</p>' +
        '<p><b>Wann Werte als verlässlich gelten:</b> wenn mindestens 80 % der Zutaten (ohne Gewürze) zugeordnet sind. Sonst steht „teilweise berechnet“ dabei, und die App vergibt keine Labels. Die App unterscheidet roh, gekocht und abgetropft (z. B. Reis, Kichererbsen aus der Dose). Fehlt eine Zutat, ergänzt du sie mit einem Tipp: aus dem BLS oder mit den Werten von der Verpackung.</p>' +
        '<p><b>Wie eigene Angaben geprüft werden:</b> (1) Jeder Wert liegt zwischen 0 und 100 g, höchstens 900 kcal, alles zusammen höchstens 100 g. (2) Zucker ist nicht mehr als Kohlenhydrate, gesättigte Fette nicht mehr als Fett – mit den Toleranzen der EU-Kommission (2012). (3) Die Kalorien müssen zu den Nährstoffen passen (4 kcal je g Kohlenhydrate und Eiweiß, 9 je g Fett, 2 je g Ballaststoffe; Europäisches Parlament &amp; Rat der Europäischen Union, 2011, Anhang XIV). Kilojoule erkennt die App und rechnet um. (4) Vergleich mit ähnlichen Lebensmitteln im BLS. Schickst du dein Gelerntes, prüft Jakob die Werte noch einmal, bevor sie für alle gelten.</p>') :
        sec("scale", "Nährwerte", '<p>Du hast die Nährwerte ausgeblendet. Die App zeigt keine Kalorien, Nährwerte oder Labels wie „proteinreich“. Du kannst das in den Einstellungen jederzeit ändern.</p>')) +

  // Vorschlag zum Folgen nach dem Speichern (5. und 15. Rezept eines Kanals); wartet, bis kein anderes Blatt offen ist

    if (!fv.fragen) return;

  // ------------------------------------------------------------------ Sicherung (eine Datei, wird ersetzt)
  function backupData() {
    return JSON.stringify({ app: "rezeptbuch", version: 1, erstellt: new Date().toISOString(), recipes: S.recipes, pantry: S.pantry, shopping: S.shopping, follow: S.follow, zuord: S.zuord, lernen: S.lernen, prefs: S.prefs, plan: S.plan, listen: S.listen }, null, 0);
  }
  function doBackup() {
    if (/claude|claudeusercontent/.test(location.hostname)) { toast("Sichern funktioniert in der installierten App, nicht in dieser Vorschau"); return; }
    var text = backupData(), name = "Kombuese-Sicherung.json";
    var done = function () { S.meta.lastBackup = Date.now(); save("meta"); render(); toast("Gesichert"); };
    try {
      var file = new File([text], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: name }).then(done, function () { /* abgebrochen */ });
        return;
      }
    } catch (e) { /* weiter mit Download */ }
    try {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); done();
    } catch (e) { toast("Sichern ist hier nicht möglich"); }
  }
  function restore(text) {
    var j; try { j = JSON.parse(text); } catch (e) { toast("Die Datei ist keine Kombüse-Sicherung"); return; }
    if (!j || j.app !== "rezeptbuch") { toast("Die Datei ist keine Kombüse-Sicherung"); return; }
    var added = 0, newer = 0;
    Object.keys(j.recipes || {}).forEach(function (id) {
      var a = S.recipes[id], b = j.recipes[id];
      if (!a) { S.recipes[id] = b; added++; } else if ((b.updatedAt || 0) > (a.updatedAt || 0)) { S.recipes[id] = b; newer++; }
    });
    Object.keys(j.pantry || {}).forEach(function (k) { var a = S.pantry[k], b = j.pantry[k]; if (!a || (b.at || 0) > (a.at || 0)) S.pantry[k] = b; });
    Object.keys(j.zuord || {}).forEach(function (k) { if (!S.zuord[k]) S.zuord[k] = j.zuord[k]; });
    Object.keys(j.follow || {}).forEach(function (k) { if (!S.follow[k]) S.follow[k] = j.follow[k]; });
    if (j.lernen && j.lernen.app === "rezeptbuch-lernen") {
      ["ignorieren", "keinSchritt", "istSchritt", "keineZutat", "keineFloskel"].forEach(function (k) { Object.keys(j.lernen[k] || {}).forEach(function (x) { (S.lernen[k] = S.lernen[k] || {})[x] = 1; }); });
      Object.keys(j.lernen.zutatAlias || {}).forEach(function (x) { if (!S.lernen.zutatAlias[x]) S.lernen.zutatAlias[x] = j.lernen.zutatAlias[x]; });
      Object.keys(j.lernen.creator || {}).forEach(function (a) { if (!S.lernen.creator[a] || S.lernen.creator[a].n < j.lernen.creator[a].n) S.lernen.creator[a] = j.lernen.creator[a]; });
      save("lernen");
