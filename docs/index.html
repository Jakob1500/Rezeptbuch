<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Rezeptbuch</title>

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: eine Spalte wie eine Banking-App. Großer Seitentitel, darunter gruppierte Listen
   auf hellen Flächen mit feinen Trennlinien, große Zahlen für Zeit und kcal, Tab-Leiste unten.
   Monochrom; ein ruhiges Grün nur für Aktionen und "vorhanden". Systemschrift (kein Abruf bei Google). */
:root {
  --bg: #F4F5F3; --surface: #FFFFFF; --surface-2: #ECEEEB; --ink: #121513; --muted: #646B66; --line: #E3E6E2;
  --accent: #0B7A55; --accent-ink: #FFFFFF; --accent-soft: #E1F0E9; --warn: #9A5B00; --warn-soft: #F7EEDC; --danger: #B3261E;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system-headline, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  --r-group: 16px; --r-ctl: 12px;
  --tabbar-h: 60px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --surface: #121513; --surface-2: #1C201D; --ink: #F1F3F1; --muted: #8F9791; --line: #242925;
  --accent: #3DC48F; --accent-ink: #04140D; --accent-soft: #10271D; --warn: #E3A94A; --warn-soft: #2A2113; --danger: #FF8A80; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --surface: #121513; --surface-2: #1C201D; --ink: #F1F3F1; --muted: #8F9791; --line: #242925;
  --accent: #3DC48F; --accent-ink: #04140D; --accent-soft: #10271D; --warn: #E3A94A; --warn-soft: #2A2113; --danger: #FF8A80; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 640px; margin: 0 auto; padding-block: 8px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; overflow-x: clip; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.topbar h1 { margin: 0; font-family: var(--font-display); font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; text-wrap: balance; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; color: var(--ink); flex: none; }
.iconbtn svg { width: 22px; height: 22px; }
h2 { margin: 0; font-size: 1.05rem; font-weight: 650; letter-spacing: -0.01em; }
.sec { display: grid; gap: 8px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-inline: 4px; }
.sec-head .link { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 0.95rem; padding: 6px 0; }
.muted { color: var(--muted); } .small { font-size: 0.875rem; } .tiny { font-size: 0.78rem; }
.num { font-variant-numeric: tabular-nums; }

/* Gruppierte Liste (eine Fläche, Zeilen mit Trennlinie) */
.group { background: var(--surface); border-radius: var(--r-group); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 56px; width: 100%; text-align: left; background: none; border: 0; position: relative; }
.row + .row::before, .row + .rowwrap::before, .rowwrap + .row::before, .rowwrap + .rowwrap::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
.rowwrap { position: relative; }
.row .main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row .title { font-weight: 600; overflow-wrap: anywhere; }
.row .sub { font-size: 0.85rem; color: var(--muted); overflow-wrap: anywhere; }
.row .end { flex: none; text-align: right; display: grid; gap: 1px; justify-items: end; }
.row .big { font-size: 1.05rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.row > svg { width: 22px; height: 22px; flex: none; color: var(--muted); }
.row > svg.chev, .chev { width: 16px; height: 16px; color: var(--muted); flex: none; }

/* Suche + Filter */
.search { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: var(--r-ctl); padding: 0 12px; min-height: 44px; }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; outline: none; font-size: 1rem; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: -4px; padding-inline: 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 0.9rem; min-height: 36px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .count { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .count { color: inherit; opacity: 0.7; }
.filtergroup { display: grid; gap: 6px; }
.filtergroup .lbl { font-size: 0.8rem; color: var(--muted); padding-inline: 4px; }

/* Rezeptkarte in der Liste */
.thumb { width: 46px; height: 46px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; flex: none; color: var(--muted); font-weight: 700; font-size: 1.05rem; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.badge.ok { background: var(--accent-soft); color: var(--accent); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }

/* Knöpfe */
a.btn { text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r-ctl); min-height: 50px; padding: 12px 18px; font-weight: 650; font-size: 1rem; background: var(--ink); color: var(--bg); width: 100%; }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.soft { background: var(--surface-2); color: var(--ink); }
.btn.ghost { background: none; color: var(--accent); min-height: 44px; }
.btn.danger { background: none; color: var(--danger); }
.btn svg { width: 20px; height: 20px; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Anleitung beim ersten Gebrauch */
.guide { background: var(--surface); border-radius: var(--r-group); padding: 16px; display: grid; gap: 12px; border: 1px solid var(--line); }
.guide h3 { margin: 0; font-size: 1rem; }
.guide ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.guide li { display: flex; gap: 12px; align-items: flex-start; font-size: 0.93rem; }
.guide .gi { width: 32px; height: 32px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.guide .gi svg { width: 18px; height: 18px; }
.guide .btn { min-height: 44px; }

/* Detail */
.hero { display: grid; gap: 10px; }
.hero h1 { margin: 0; font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: var(--r-group); }
.fact { padding: 14px 12px; display: grid; gap: 2px; text-align: center; }
.fact + .fact { border-left: 1px solid var(--line); }
.fact b { font-size: 1.45rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; line-height: 1.15; }
.fact span { font-size: 0.78rem; color: var(--muted); }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface); font-size: 1.2rem; font-weight: 600; display: grid; place-items: center; }
.stepper output { min-width: 3.2em; text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
.ing .qty { width: 5.2em; flex: none; font-weight: 650; font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 2px solid var(--line); }
.dot.have { background: var(--accent); border-color: var(--accent); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px 16px; position: relative; }
.steps li + li::before { content: ""; position: absolute; top: 0; left: 54px; right: 0; height: 1px; background: var(--line); }
.snip { display: flex; gap: 8px; align-items: center; margin: 4px 0 2px; }
.snip code { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 0.78rem; background: var(--surface-2); border-radius: 8px; padding: 6px 8px; }
.snip button { flex: none; border: 0; background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-size: 0.8rem; font-weight: 600; color: var(--accent); }
.build ol { margin: 0; padding-left: 20px; } .build li { margin: 0 0 10px; line-height: 1.4; } .build li b { font-weight: 650; }
.steps .ing-chips { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.steps .ing-chips span { font-size: 0.78rem; background: var(--surface-2); border-radius: 999px; padding: 3px 9px; color: var(--muted); }
.steps li.head { display: block; padding: 14px 16px 4px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.steps li.head + li::before, .steps li + li.head::before { display: none; }
.hero .desc { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cook .stephead { margin: 0 0 6px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.steps .n { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 0.82rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.nutri { display: grid; grid-template-columns: repeat(4, 1fr); }
.nutri div { padding: 12px 8px; text-align: center; display: grid; gap: 2px; }
.nutri b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.nutri span { font-size: 0.75rem; color: var(--muted); }
.labels { display: grid; gap: 10px; padding: 14px 16px; }
.labels .lg { display: grid; grid-template-columns: 8.5em 1fr; gap: 8px; align-items: baseline; font-size: 0.9rem; }
.labels .lg > span:first-child { color: var(--muted); font-size: 0.82rem; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 0.82rem; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); }
.note { background: var(--warn-soft); color: var(--ink); border-radius: var(--r-group); padding: 12px 14px; font-size: 0.9rem; display: grid; gap: 6px; }
.note.info { background: var(--accent-soft); }
.field { display: grid; gap: 6px; }
.field label { font-size: 0.85rem; color: var(--muted); padding-inline: 4px; }
.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-ctl); padding: 12px 14px; min-height: 48px; font-size: 1rem; outline: none; }
textarea.input { min-height: 140px; resize: vertical; line-height: 1.4; }
.input:focus { border-color: var(--accent); }

/* Einkauf */
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: none; flex: none; display: grid; place-items: center; color: var(--accent-ink); padding: 0; }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.check svg { width: 14px; height: 14px; }
.row.done .title { color: var(--muted); text-decoration: line-through; }
.toggle { position: relative; width: 51px; height: 31px; border-radius: 999px; background: var(--surface-2); border: 0; flex: none; transition: background .15s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }

/* Tab-Leiste */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabbar nav { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
.tab { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: 0.7rem; font-weight: 600; position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab .pill { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 0.68rem; display: grid; place-items: center; padding: 0 5px; font-variant-numeric: tabular-nums; }

/* Blatt von unten (Dialoge) */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 30; display: grid; align-items: end; }
.sheet { background: var(--bg); border-radius: 20px 20px 0 0; max-height: 88vh; overflow-y: auto; padding-block: 10px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; max-width: 640px; width: 100%; margin: 0 auto; }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheet h2 { font-size: 1.25rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  background: var(--ink); color: var(--bg); border-radius: 999px; padding: 10px 18px; font-size: 0.92rem; font-weight: 600; max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 40px; height: 40px; color: var(--muted); }
.banner { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--r-group); padding: 12px 14px; border: 1px solid var(--line); }
.banner > svg { width: 24px; height: 24px; flex: none; color: var(--accent); }
.banner .main { flex: 1; min-width: 0; font-size: 0.9rem; }
.banner .btn { width: auto; min-height: 40px; padding: 8px 14px; font-size: 0.9rem; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.foot { font-size: 0.78rem; color: var(--muted); padding-inline: 4px; display: grid; gap: 6px; }
a { color: var(--accent); }

/* Dynamic Type: übernimmt die Textgröße aus den iPhone-Einstellungen */
@supports (font: -apple-system-body) { html { font: -apple-system-body; } body { font-size: 1rem; } }
.hello { color: var(--muted); font-size: 0.95rem; margin-top: -14px; padding-inline: 2px; }
.tiles { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); scroll-snap-type: x mandatory; padding-bottom: 2px; }
.tiles::-webkit-scrollbar { display: none; }
.tile { flex: none; width: 152px; scroll-snap-align: start; background: var(--surface); border: 0; border-radius: var(--r-group); padding: 14px; display: grid; gap: 8px; text-align: left; align-content: start; min-height: 150px; }
.tile .title { font-weight: 650; font-size: 0.95rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.tile .sub { font-size: 0.8rem; color: var(--muted); }
.glyph { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink); flex: none; }
.glyph svg { width: 22px; height: 22px; }
.row .glyph { width: 46px; height: 46px; }
.toolbar { display: flex; gap: 8px; align-items: center; }
.toolbar .search { flex: 1; min-width: 0; }
.fbtn { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: var(--r-ctl); border: 0; background: var(--surface-2); font-weight: 600; font-size: 0.92rem; }
.fbtn svg { width: 18px; height: 18px; }
.fbtn .n { background: var(--accent); color: var(--accent-ink); border-radius: 9px; min-width: 18px; height: 18px; font-size: 0.72rem; display: grid; place-items: center; padding: 0 5px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.chip.on svg { width: 14px; height: 14px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 8px; min-height: 36px; font-size: 0.88rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.iconbtn[aria-pressed="true"] { color: var(--accent); }
.iconbtn.heart[aria-pressed="true"] svg { fill: currentColor; }
.have-line { font-size: 0.85rem; color: var(--muted); padding-inline: 4px; display: flex; align-items: center; gap: 6px; }
.miss { font-size: 0.78rem; font-weight: 600; color: var(--accent); }
.guide { position: relative; }
.guide .x { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; color: var(--muted); display: grid; place-items: center; }
.guide .x svg { width: 18px; height: 18px; }
.ibtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--muted); display: grid; place-items: center; flex: none; }
.ibtn svg { width: 20px; height: 20px; }
.ibtn[aria-pressed="true"] { color: var(--accent); }
.rchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border-radius: 999px; background: var(--surface); font-size: 0.88rem; max-width: 100%; }
.rchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rchip button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.rchip button svg { width: 12px; height: 12px; }
.wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }
/* Kochmodus */
.cook { position: fixed; inset: 0; z-index: 35; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cook .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 640px; width: 100%; margin: 0 auto; }
.cook .body { overflow-y: auto; max-width: 640px; width: 100%; margin: 0 auto; display: grid; align-content: start; gap: 20px; padding-block: 20px; }
.cook .stepno { font-size: 0.9rem; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.cook .steptext { font-size: 1.6rem; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; text-wrap: pretty; }
.cook .foot2 { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; max-width: 640px; width: 100%; margin: 0 auto; }
.dots { display: flex; gap: 4px; }
.dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-2); }
.dots i.on { background: var(--accent); }
/* Kategorien */
.catgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cat { background: var(--surface); border: 0; border-radius: var(--r-group); padding: 16px; display: grid; gap: 14px; text-align: left; min-height: 132px; align-content: space-between; }
.cat .glyph { width: 52px; height: 52px; border-radius: 16px; }
.cat .glyph svg { width: 28px; height: 28px; }
.cat b { font-size: 1rem; font-weight: 650; display: block; }
.cat span.c { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat[disabled] { opacity: .45; }
@media (min-width: 560px) { .catgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tab span { white-space: nowrap; }
@media (max-width: 360px) { .tab { font-size: 0.62rem; } }
/* Infoseite */
.info { display: grid; gap: 0; }
.info details { border-top: 1px solid var(--line); }
.info details:first-child { border-top: 0; }
.info summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 56px; font-weight: 600; }
.info summary::-webkit-details-marker { display: none; }
.info summary svg { width: 22px; height: 22px; flex: none; color: var(--accent); }
.info summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; flex: none; }
.info details[open] summary::after { transform: rotate(-135deg); }
.info .body { padding: 0 16px 16px 50px; display: grid; gap: 8px; font-size: 0.92rem; }
.info .body p, .info .body ul { margin: 0; }
.info .body ul { padding-left: 18px; display: grid; gap: 4px; }
.info .detail { display: grid; gap: 8px; padding-top: 6px; border-top: 1px dashed var(--line); color: var(--ink); }
.refs { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 10px; }
.refs li { padding-left: 1.5em; text-indent: -1.5em; font-size: 0.86rem; overflow-wrap: anywhere; }
.refs a { word-break: break-all; }
.glance { display: grid; gap: 10px; padding: 16px; }
.glance div { display: flex; gap: 10px; align-items: flex-start; font-size: 0.93rem; }
.glance svg { width: 20px; height: 20px; color: var(--accent); flex: none; margin-top: 1px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (min-width: 700px) { .topbar h1 { font-size: 2.25rem; } }

  // Was der Creator selbst behauptet ("proteinreich", "vegan") – wird als "laut Creator" markiert

  /**
   * Analysiert ein Transkript (gesprochener Text ohne Zeilenumbrüche).
   */
  // Gesprochener Text aus dem Video (Kurzbefehl „Audio transkribieren“). Deutsch oder Englisch,
  // oft ohne Zeilen und mit Füllwörtern: Mengenangaben werden zu Zutaten, Koch-Sätze zu Schritten.

  // Text aus vielen Videobildern (Live Text je Bild): gleiche und sich wiederholende Zeilen zusammenfassen,
  // Bedienelemente von Instagram weglassen, Reihenfolge des ersten Auftretens behalten
  var IG_UI = /^(gefällt|liked by|folgen|follow|following|abonniert|audio(?:-original)?|original audio|originalton|reels?|kommentare?|comments?|teilen|share|senden|send|mehr|more|… mehr|\.\.\. more|gesponsert|sponsored|\d+(?:[.,]\d+)?\s*(?:k|mio|tsd)?\s*(?:likes?|kommentare|comments|aufrufe|views)?|\d{1,2}:\d{2}|lte|5g|\d+\s*%|@[\w.]+|#\w+)$/i;
  var IG_UI_START = /^(gefällt|liked by|alle \d+ kommentare|view all|kommentieren|add a comment|vor \d+ (?:min|std|tag)|\d+ (?:min|std|h|d|w) ago)/i;

  // ---------------------------------------------------------------------------
  // Blog-Rezeptdaten (schema.org/Recipe als JSON-LD)
  // ---------------------------------------------------------------------------

  function extractJsonLdBlocks(html) {

    var re = /<script[^>]*type\s*=\s*["']?application\/ld\+json["']?[^>]*>([\s\S]*?)<\/script>/gi;
    var m;

      }
    }

  }

  function findRecipeNode(node, depth) {
    if (!node || depth > 8) return null;
    if (Array.isArray(node)) {
      for (var i = 0; i < node.length; i++) { var f = findRecipeNode(node[i], depth + 1); if (f) return f; }
      return null;
    }

    var types = Array.isArray(type) ? type : [type];

    if (node["@graph"]) { var g = findRecipeNode(node["@graph"], depth + 1); if (g) return g; }

    return null;
  }

  function textOf(v) {

    if (typeof v === "string") return clean(stripTags(v));
    if (typeof v === "number") return String(v);
    if (Array.isArray(v)) return textOf(v[0]);
    if (v.text) return textOf(v.text);
    if (v.name) return textOf(v.name);
    if (v["@value"]) return textOf(v["@value"]);
    return "";
  }

  function flattenInstructions(v) {
    var out = [];
    (function walk(x) {
      if (!x) return;
      if (typeof x === "string") {
        stripTags(x).split(/\n+/).map(clean).filter(Boolean).forEach(function (s) { out.push(s); });
        return;
      }
      if (Array.isArray(x)) { x.forEach(walk); return; }
      if (x.itemListElement) { walk(x.itemListElement); return; }
      if (x.text) { walk(x.text); return; }

  }

  /**
   * Liest schema.org/Recipe aus HTML (oder schon geparstem JSON-LD).
   * Gibt ein vollständiges Rezept oder null zurück.
   */

    for (var i = 0; i < blocks.length && !node; i++) node = findRecipeNode(blocks[i], 0);
    if (!node) return null;
    var r = emptyRecipe();
    r.title = textOf(node.name);
    var y = Array.isArray(node.recipeYield) ? node.recipeYield.map(textOf).join(" ") : textOf(node.recipeYield);
    r.servings = num(y);
    var ings = node.recipeIngredient || node.ingredients || [];
    if (!Array.isArray(ings)) ings = [ings];
    r.ingredients = ings.map(function (s) { return parseIngredientLine(textOf(s)); }).filter(Boolean);
    r.steps = flattenInstructions(node.recipeInstructions);
    r.timePrep = parseDuration(textOf(node.prepTime));
    r.timeCook = parseDuration(textOf(node.cookTime));
    r.timeTotal = parseDuration(textOf(node.totalTime)) || ((r.timePrep || 0) + (r.timeCook || 0)) || null;
    var cats = [].concat(node.recipeCategory || []).map(textOf).filter(Boolean);
    r.blogCategory = cats.join(", ");
    r.cuisine = [].concat(node.recipeCuisine || []).map(textOf).filter(Boolean).join(", ");
    r.keywords = textOf(node.keywords);
    r.blogDiets = [].concat(node.suitableForDiet || []).map(function (d) {

  // ---------------------------------------------------------------------------
  // Klassifizierung (ohne LLM)
  // ---------------------------------------------------------------------------

  function classify(r) {
    var ingText = r.ingredients.map(function (i) {
      if (/(^|,\s*)(v|vegan|vegane?r?|pflanzlich)(\s*,|$)/i.test(i.note || "")) return "vegan " + lower(i.name);
      return lower(i.name + " " + (i.note || ""));
    }).join(" | ");
    var allText = lower(r.title + " | " + ingText + " | " + r.steps.join(" | ") + " | " + (r.description || "") + " | " + (r.keywords || "") + " | " + (r.blogCategory || ""));

    // Ernährungsstil
    var diet = [];
    if (r.ingredients.length >= 2) {
      var meat = matchWithExceptions(ingText, DICT.meat, NOT_ANIMAL);
      var fish = matchWithExceptions(ingText, DICT.fish, NOT_ANIMAL);
      var dairy = matchWithExceptions(ingText, DICT.dairy, NOT_ANIMAL);
      var egg = matchWithExceptions(ingText, DICT.egg, NOT_ANIMAL);
      var honey = matchWithExceptions(ingText, DICT.honey, NOT_ANIMAL);
      if (!meat && !fish && !dairy && !egg && !honey) diet.push("vegan");
      if (!meat && !fish) diet.push("vegetarisch");
      else if (!meat && fish) diet.push("pescetarisch");
      else diet.push("mit Fleisch");
      r.dietEvidence = { meat: meat, fish: fish, dairy: dairy, egg: egg, honey: honey };
    }
    r.diet = diet;

    // Allergene
    var allergens = [];
    Object.keys(ALLERGENS).forEach(function (a) {
      if (matchWithExceptions(ingText, ALLERGENS[a], ALLERGEN_EXCEPTIONS[a])) allergens.push(a);
    });
    if (/glutenfrei|gluten.?free/.test(allText)) allergens = allergens.filter(function (a) { return a !== "Gluten"; });
    r.allergens = allergens;

    // Kategorie: Titel zählt dreifach
    var best = null, bestScore = 0, scores = {};
    var title = lower(r.title + " " + (r.titleOriginal || ""));
    CATEGORY_KEYWORDS.forEach(function (c) {
      var score = 0;
      c[1].forEach(function (k) {
        if (title.indexOf(k) !== -1) score += 3;
        else if (CAT_WORD_START[k] ? new RegExp("(^|[^a-zäöüß])" + k).test(allText) : allText.indexOf(k) !== -1) score += (c[0] === "Hauptgericht" ? 0.6 : c[0] === "Sauce & Dip" || c[0] === "Suppe & Eintopf" || c[0] === "Getränk" ? 0.4 : 1);
      });
      scores[c[0]] = score;
      if (score > bestScore) { bestScore = score; best = c[0]; }
    });
    // Backen-Muster: Mehl + Backtriebmittel + Ofen
    if (bestScore < 3 && /mehl|flour/.test(ingText) && /(backpulver|natron|hefe|baking powder|yeast)/.test(ingText) && /(ofen|oven|backen|bake)/.test(allText) && /zucker|sugar|sirup|honig/.test(ingText)) best = "Backen";
    // Gerichtsart am Titelende hat Vorrang ("Lasagne-Suppe", "Linsen-Salat")
    var tEnd = lower(r.title || "").match(/(suppe|soup|eintopf|stew|schmortopf|salat|salad|bowl|kuchen|cake|muffins?|brot|brote|brötchen|strudel|cookies|smoothie|dip|pesto|hummus|-eis|eiscreme|nicecream)$/);
    if (tEnd) { best = /suppe|soup|eintopf|stew|schmortopf/.test(tEnd[1]) ? "Suppe & Eintopf" : /salat|salad|bowl/.test(tEnd[1]) ? "Salat & Bowl" : /kuchen|cake|muffin|brot|brötchen|strudel|cookies/.test(tEnd[1]) ? "Backen" : /eis|cream/.test(tEnd[1]) ? "Dessert" : /smoothie/.test(tEnd[1]) ? "Getränk" : "Sauce & Dip"; bestScore = 9; scores[best] = Math.max(scores[best] || 0, 9); }
    // Viele Zutaten + nur "Dressing"/"Sauce" im Text: eher Salat oder Hauptgericht als reiner Dip
    if (best === "Sauce & Dip" && bestScore < 3 && (r.ingredients.length > 12 || /dressing/.test(allText) && r.ingredients.length > 5)) {
      best = /dressing/.test(allText) && /(gurke|salat|avocado|kohl|cucumber|lettuce|spinat|rucola)/.test(ingText) ? "Salat & Bowl" : null;
      bestScore = 0;
    }
    r.category = best || "Hauptgericht";
    r.categoryAlso = Object.keys(scores).filter(function (c) { return c !== r.category && scores[c] >= 3; });
    r.categoryBasis = best ? "Stichworte" : "Standard";

    // Geräte
    var full = r.title + " " + r.steps.join(" ");
    r.equipment = EQUIPMENT.filter(function (e) { return e[1].test(full); }).map(function (e) { return e[0]; });
    if (!r.equipment.length && r.steps.length) r.equipment = ["ohne Kochen"];

    // Schwierigkeit (Heuristik)
    var score = r.steps.length + r.ingredients.length / 3;
    if (TECHNIQUES.test(full)) score += 4;
    if ((r.timeTotal || 0) > 90) score += 3;
    r.difficulty = score <= 8 ? "einfach" : score <= 14 ? "mittel" : "anspruchsvoll";

    // Ernährungsfokus: erst einmal nur aus deklarierten Nährwerten (Blog) nach EU-Schwellen.
    // Mit der BLS-Datenbank wird das später für jedes Rezept berechnet.
    r.focus = focusFromNutrition(r.nutritionDeclared, r.nutritionDeclared ? r.nutritionDeclared.basis : "");
    (r.creatorClaims || []).forEach(function (c) {
      if (["proteinreich", "kalorienarm", "low-carb", "meal-prep"].indexOf(c) !== -1 && !r.focus.some(function (f) { return f.label === c; })) {
        r.focus.push({ label: c, basis: "laut Creator" });
      }
    });
    return r;
  }

  // Schwellen angelehnt an die EU-Regeln für nährwertbezogene Angaben (VO (EG) 1924/2006, Anhang)
  // und die Nährstoffbezugswerte (NRV) der LMIV. "hoher Gehalt" = mind. 30 % NRV – hier je Portion.
  //   proteinreich      ≥ 20 % der Energie aus Protein
  //   ballaststoffreich ≥ 3 g je 100 kcal
  //   eisenreich        ≥ 4,2 mg (30 % von 14 mg)
  //   calciumreich      ≥ 240 mg (30 % von 800 mg)
  //   magnesiumreich    ≥ 112,5 mg (30 % von 375 mg)

    ["proteinreich", function (n) { return n.protein != null && (n.protein * 4) / n.kcal >= 0.2; }],
    ["ballaststoffreich", function (n) { return n.fiber != null && n.fiber / (n.kcal / 100) >= 3; }],
    ["eisenreich", function (n) { return n.iron != null && n.iron >= 4.2; }],
    ["calciumreich", function (n) { return n.calcium != null && n.calcium >= 240; }],
    ["magnesiumreich", function (n) { return n.magnesium != null && n.magnesium >= 112.5; }],
    ["vitamin-C-reich", function (n) { return n.vitC != null && n.vitC >= 24; }],
    ["omega-3-reich", function (n) { return n.omega3 != null && n.omega3 / (n.kcal / 100) >= 0.6; }]

  function focusFromNutrition(n, basis) {
    var out = [];
    if (!n || !n.kcal) return out;
    FOCUS_RULES.forEach(function (r) { if (r[1](n)) out.push({ label: r[0], basis: basis }); });
    return out;
  }

  // ---------------------------------------------------------------------------
  // Vollständigkeit, Zusammenführen, Analyse-Kette
  // ---------------------------------------------------------------------------

  function emptyRecipe() {
    return {
      schema: SCHEMA_VERSION, title: "", servings: null, ingredients: [], steps: [],
      timeTotal: null, timePrep: null, timeCook: null, timeEstimated: false,
      category: "", diet: [], allergens: [], difficulty: "", focus: [], equipment: [],
      source: { url: "", account: "", blogUrl: "" }, links: [], linkInBio: false,
      creatorClaims: [], provenance: {}
    };
  }

    ["title", "servings", "ingredients", "steps", "timeTotal"].forEach(function (f) {

    });

    if (!list || !list.length) return 0;
    var withQty = list.filter(function (i) { return (i.qty != null && !i.qtyEstimated) || /prise|etwas|nach geschmack|to taste|optional/i.test(i.raw); }).length;
    return list.length * (0.4 + 0.6 * (withQty / list.length));
  }

  /**
   * Wie vollständig ist das Rezept? score 0–100, missing = fehlende Teile,

  var TR_MAX = 12000; // ca. 20 Rezepte pro Durchgang; bei Problemen kleiner stellen

  function englishEntries() { return entries().filter(function (e) { return !!foreignLang(e.recipe, e); }); }
  function startTranslate(firstId) {
    var list = englishEntries();

    if (!list.length) { toast("Alle Rezepte sind schon auf Deutsch"); return; }
    // pro Durchgang nur eine Sprache, damit Apples Übersetzer sie sicher erkennt
    var lang = foreignLang(list[0].recipe, list[0]);
    list = list.filter(function (e) { return foreignLang(e.recipe, e) === lang; });
    var lines = [], ids = [], len = 0;
    for (var n = 0; n < list.length; n++) {
      var r = list[n].recipe, block = [];
      if (titleForeign(r, list[n]) || (!r.titleTranslated && r.titleOriginal && !/[äöüß]/i.test(titleOf(list[n])) && K.isEnglishTitle(r.titleOriginal))) block.push("#" + n + ".0# " + (titleForeign(r, list[n]) ? r.title : r.titleOriginal));

    var serv = UI.servings[c.id] || defaultServings(r), f = r.servings ? serv / r.servings : 1;
    var sMap = K.stepIngredients(r), seenC = {};

  function doBackup() {
    if (/claude|claudeusercontent/.test(location.hostname)) { toast("Sichern funktioniert in der installierten App, nicht in dieser Vorschau"); return; }
    var text = backupData(), name = "Rezeptbuch-Sicherung.json";
    var done = function () { S.meta.lastBackup = Date.now(); save("meta"); render(); toast("Gesichert"); };
    try {
      var file = new File([text], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: name }).then(done, function () { /* abgebrochen */ });
        return;
      }
    } catch (e) { /* weiter mit Download */ }
    try {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); done();
    } catch (e) { toast("Sichern ist hier nicht möglich"); }
  }
  function restore(text) {
    var j; try { j = JSON.parse(text); } catch (e) { toast("Die Datei ist keine Rezeptbuch-Sicherung"); return; }
    if (!j || j.app !== "rezeptbuch") { toast("Die Datei ist keine Rezeptbuch-Sicherung"); return; }
    var added = 0, newer = 0;
    Object.keys(j.recipes || {}).forEach(function (id) {
      var a = S.recipes[id], b = j.recipes[id];
      if (!a) { S.recipes[id] = b; added++; } else if ((b.updatedAt || 0) > (a.updatedAt || 0)) { S.recipes[id] = b; newer++; }
    });
    Object.keys(j.pantry || {}).forEach(function (k) { var a = S.pantry[k], b = j.pantry[k]; if (!a || (b.at || 0) > (a.at || 0)) S.pantry[k] = b; });
    Object.keys(j.zuord || {}).forEach(function (k) { if (!S.zuord[k]) S.zuord[k] = j.zuord[k]; });
    Object.keys(j.follow || {}).forEach(function (k) { if (!S.follow[k]) S.follow[k] = j.follow[k]; });
    ["recipes", "pantry", "zuord", "follow"].forEach(save);
    closeSheet(); render(); toast(added + " neu, " + newer + " aktualisiert");
  }

  // ------------------------------------------------------------------ Instagram-Export (ZIP oder JSON) lesen
  function readZip(buf) {
    var dv = new DataView(buf), u8 = new Uint8Array(buf), files = [];
    var eocd = -1;
    for (var i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) return Promise.reject(new Error("keine ZIP-Datei"));
    var cnt = dv.getUint16(eocd + 10, true), off = dv.getUint32(eocd + 16, true);
    var dec = new TextDecoder();
    for (var n = 0; n < cnt; n++) {
      var nameLen = dv.getUint16(off + 28, true), extra = dv.getUint16(off + 30, true), comLen = dv.getUint16(off + 32, true);
      var method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true), local = dv.getUint32(off + 42, true);
      var name = dec.decode(u8.subarray(off + 46, off + 46 + nameLen));
      if (/saved_(posts|collections)\.json$/.test(name)) {
        var lnl = dv.getUint16(local + 26, true), lex = dv.getUint16(local + 28, true);
        files.push({ name: name, method: method, data: u8.subarray(local + 30 + lnl + lex, local + 30 + lnl + lex + csize) });
      }
      off += 46 + nameLen + extra + comLen;
    }
    return Promise.all(files.map(function (f) {
      if (f.method === 0) return dec.decode(f.data);
      if (typeof DecompressionStream === "undefined") return Promise.reject(new Error("Entpacken nicht möglich"));
      var ds = new DecompressionStream("deflate-raw");
      return new Response(new Blob([f.data]).stream().pipeThrough(ds)).text();
    }));
  }
  function handleExportFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    toast("Export wird gelesen …");
    Promise.all(files.map(function (f) {
      return f.arrayBuffer().then(function (buf) { return /\.zip$/i.test(f.name) || new Uint8Array(buf, 0, 2)[0] === 0x50 ? readZip(buf) : [new TextDecoder().decode(buf)]; });
    })).then(function (parts) {
      var jsons = [].concat.apply([], parts).map(function (t) { try { return JSON.parse(t); } catch (e) { return null; } }).filter(Boolean);
      if (!jsons.length) throw new Error("keine Daten");
      var posts = K.parseInstagramExport(jsons);
      var recipes = [];
      posts.forEach(function (p) {
        var res = K.analyse({ caption: p.caption, url: p.url, account: p.account, ownerUrl: p.ownerUrl });
        var like = K.recipeLikelihood(res, p.caption, p.url);
        if (like.recipe) recipes.push({ id: p.id, p: p, res: res, like: like });
      });
      var ids = Object.keys(S.recipes);
      var sorted = K.importNeue(ids, recipes);
      UI.importRes = { posts: posts.length, recipes: recipes.length, known: sorted.vorhanden.length, neu: sorted.neu };
      render();
    }).catch(function (e) { toast("Export konnte nicht gelesen werden: " + e.message); });
  }

  // ------------------------------------------------------------------ Teilen aus Instagram (Kurzbefehl) über die Adresse
  // Format: …/#u=<Instagram-Link>&t=<Text der Einbettungsseite oder Caption>
  function readHashImport() {
    var h = location.hash.replace(/^#/, "");
    if (h === "uebersetzt") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* egal */ } if (S.meta.trPending) setTimeout(pasteTranslation, 300); return false; }
    if (!/(^|&)(t|u|o|s)=/.test(h)) return false;
    var p = {}; h.split("&").forEach(function (kv) { var i = kv.indexOf("="); if (i > 0) { try { p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " ")); } catch (e) { /* kaputt */ } } });
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* egal */ }
    var text = p.t || "", url = p.u || "";
    // Video-/Bild-Text zu einem schon gespeicherten Rezept: dort ergänzen statt neu anlegen
    if (url && !text && (p.o || p.s)) {
      var known = entries().filter(function (e) { return e.input && e.input.url && e.input.url.split("?")[0] === url.split("?")[0]; })[0];
      if (known) {
        if (p.o) known.input.ocrText = p.o; if (p.s) known.input.transcript = p.s;
        reanalyse(known); save("recipes"); UI.tab = "rezepte"; UI.detail = known.id;
        setTimeout(function () { toast("Rezept mit Text aus dem Video ergänzt"); }, 300);
        return true;
      }
    }
    var emb = /Gefällt|Liked by|class="Caption"|Profil ansehen|View profile/.test(text) ? K.parseInstagramEmbed(text) : null;
    var caption = emb ? emb.caption : text;
    var account = emb ? emb.account : (p.a || "");
    var de = p.d || "";
    if (de && /Gefällt|class="Caption"|Profil ansehen/.test(de)) { var embDe = K.parseInstagramEmbed(de); if (embDe) de = embDe.caption; }
    if (de && caption && de.replace(/\s+/g, " ").trim() === caption.replace(/\s+/g, " ").trim()) de = ""; // war schon deutsch
    if (url && /instagram\.com/.test(url)) { S.meta.shortcutOk = true; save("meta"); }
    // Testlauf aus der Einrichtung
    if (/\/p\/C0Test\/?$/.test(url)) { setTimeout(function () { toast("Der Kurzbefehl funktioniert. Jetzt in Instagram teilen."); }, 300); return false; }
    var input = { caption: caption, url: url, account: account, ocrText: p.o || "", transcript: p.s || "", captionDe: de };
    // schon gespeichert? Dann öffnen statt doppelt anlegen
    var same = url ? entries().filter(function (e) { return e.input && e.input.url && e.input.url.split("?")[0].replace(/\/$/, "") === url.split("?")[0].replace(/\/$/, ""); })[0] : null;
    if (same) { UI.tab = "rezepte"; UI.detail = same.id; setTimeout(function () { toast("Schon im Rezeptbuch"); }, 300); return true; }
    startDraft(input);
    // Rezept erkannt: sofort speichern, ohne weiteren Tipp
    if (UI.draft && UI.draft.like && UI.draft.like.recipe) {
      var out = addRecipe(UI.draft.res, { input: input, typ: UI.draft.like.typ });
      UI.draft = null; UI.tab = "rezepte"; UI.detail = out.id;
      setTimeout(function () { toast(out.dupe ? "Schon im Rezeptbuch" : "Im Rezeptbuch gespeichert"); }, 300);
      return true;
    }
    UI.tab = "neu"; UI.detail = null;
    return true;
  }
  function startDraft(input) {
    var res = K.analyse(input);
    var like = input.caption ? K.recipeLikelihood(res, input.caption, input.url) : null;
    UI.draft = { input: input, res: res, like: like };
  }

  // ------------------------------------------------------------------ Aktionen

      case "cat": UI.cat = el.dataset.c; render(); window.scrollTo(0, 0); break;

        else if (!el.dataset.ok) { nutriConfirmSheet(); }

      case "translate-apply": applyTranslationText(($("#trtext") || {}).value || ""); break;
      case "translate-cancel": S.meta.trPending = null; save("meta"); closeSheet(); render(); break;
      case "open": closeSheet(); UI.detail = id; if (S.recipes[id]) { S.recipes[id].viewedAt = Date.now(); save("recipes"); } render(); window.scrollTo(0, 0); break;
      case "filters": filterSheet(); break;
      case "sort": UI.sort = el.dataset.v; render(); break;
      case "onboard": onboardSheet(); break;
      case "onboard-save":

        if (!S.meta.setupAsked) setTimeout(setupSheet, 250);
        break;
      case "pref-persons": S.prefs.persons = Math.max(1, Math.min(12, (S.prefs.persons || 2) + (+el.dataset.d))); save("prefs"); el.parentNode.querySelector("output").textContent = S.prefs.persons; UI.servings = {}; render(); break;
      case "pref-diet": S.prefs.diet = el.dataset.v; save("prefs"); Array.prototype.forEach.call(el.parentNode.children, function (b) { b.setAttribute("aria-pressed", String(b === el)); }); render(); break;
      case "pref-theme": S.prefs.theme = el.dataset.v; save("prefs"); applyTheme(); Array.prototype.forEach.call(el.parentNode.children, function (b) { b.setAttribute("aria-pressed", String(b === el)); }); break;
      case "fav": S.recipes[id].fav = !S.recipes[id].fav; save("recipes"); render(); toast(S.recipes[id].fav ? "Zu Favoriten hinzugefügt" : "Aus Favoriten entfernt"); break;
      case "more": moreSheet(id); break;
      case "cook": startCook(id); break;
      case "add-text":
        sheet('<h2>Fehlenden Text einfügen</h2><p class="small">Kopiere den Rest des Rezepts, zum Beispiel aus dem angepinnten Kommentar, der Nachricht oder vom Blog, und füge ihn hier ein. Die App liest Zutaten und Schritte daraus und ergänzt das Rezept.</p>' +
          '<div class="field"><label for="addtext">Text</label><textarea class="input" id="addtext" placeholder="Zutaten … / Zubereitung …"></textarea></div>' +
          '<div class="btnrow"><button class="btn" data-a="add-text-save" data-id="' + esc(id) + '">Übernehmen</button><button class="btn soft" data-a="close-sheet">Abbrechen</button></div>');
        break;
      case "add-text-save":
        var at = (($("#addtext") || {}).value || "").trim(), ae = S.recipes[id];
        if (at && ae && ae.input) { ae.input.commentText = (ae.input.commentText ? ae.input.commentText + "\n\n" : "") + at; reanalyse(ae); save("recipes"); toast("Rezept ergänzt"); }
        closeSheet(); render(); break;
      case "cook-next": UI.cook.step++; renderCook(); break;
      case "cook-prev": if (UI.cook.step > 0) { UI.cook.step--; renderCook(); } break;
      case "cook-close": endCook(); break;
      case "cook-done": var ce = S.recipes[UI.cook.id]; ce.cooked = (ce.cooked || 0) + 1; ce.lastCooked = Date.now(); save("recipes"); endCook(); render(); toast("Guten Appetit!"); break;
      case "uncook": S.recipes[id].cooked = 0; S.recipes[id].lastCooked = 0; save("recipes"); closeSheet(); render(); break;
      case "back": UI.detail = null; render(); break;
      case "settings": settingsSheet(); break;
      case "setup": setupSheet(); render(); break;
      case "show-build": UI.showBuild = true; setupSheet(); break;
      case "sc-run-link": closeSheet(); UI.pasteText = ""; runShortcut(el.dataset.t); break;
      case "sc-test": closeSheet(); toast("Kurzbefehl wird mit einem Beispiel-Link gestartet …"); setTimeout(function () { runShortcut("https://www.instagram.com/p/C0Test/"); }, 400); break;
      case "close-sheet": closeSheet(); break;
      case "guide-ok": S.meta.guides[el.dataset.k] = true; save("meta"); render(); break;
      case "info": infoSheet(); break;
      case "info-detail": UI.infoDetail = el.dataset.v === "1"; infoSheet(); break;
      case "guides-reset": S.meta.guides = {}; save("meta"); closeSheet(); render(); toast("Anleitungen werden wieder gezeigt"); break;
      case "filter": var g = el.dataset.g, v = el.dataset.v; UI.filter[g] = UI.filter[g] === v ? null : v; render(); if (el.dataset.keep) filterSheet(); break;
      case "filter-reset": UI.filter = {}; render(); if (el.dataset.keep) filterSheet(); break;
      case "remove-examples": Object.keys(S.recipes).forEach(function (k) { if (S.recipes[k].example) delete S.recipes[k]; }); S.shopping.list = S.shopping.list.filter(function (x) { return S.recipes[x.id]; }); save("recipes"); save("shopping"); render(); toast("Beispiele entfernt"); break;
      case "orig": UI.showOrig[id] = !UI.showOrig[id]; closeSheet(); render(); break;
      case "serv": var e = S.recipes[id], cur = UI.servings[id] || defaultServings(e.recipe); UI.servings[id] = Math.max(1, cur + (+el.dataset.d)); render(); break;
      case "to-list":
        var e2 = S.recipes[id], sv = UI.servings[id] || defaultServings(e2.recipe);
        var ex = S.shopping.list.filter(function (x) { return x.id === id; })[0];
        if (ex) ex.servings = sv; else S.shopping.list.push({ id: id, servings: sv });
        save("shopping"); render();
        toast(missingOf(e2.recipe).missing + " Zutaten auf der Einkaufsliste");
        break;
      case "unlist": S.shopping.list = S.shopping.list.filter(function (x) { return x.id !== id; }); save("shopping"); render(); break;
      case "clear-list": S.shopping = { list: [], done: {} }; save("shopping"); render(); break;
      case "done": S.shopping.done[el.dataset.k] = !S.shopping.done[el.dataset.k]; save("shopping"); render(); break;
      case "have": setHave(el.dataset.k, true); delete S.shopping.done[el.dataset.k]; save("shopping"); render(); toast("Im Vorrat gemerkt, erscheint nicht mehr auf Listen"); break;
      case "need": setHave(el.dataset.k, false); render(); break;
      case "toggle-have": UI.showHave = !UI.showHave; render(); break;
      case "copy-item": copy(el.dataset.t, "„" + el.dataset.t + "“ kopiert"); break;
      case "copy-all": copy(K.shoppingText(shoppingItems().filter(function (i) { return !S.shopping.done[i.key]; })), "Einkaufsliste kopiert"); break;
      case "share-list":
        var txt = K.shoppingText(shoppingItems().filter(function (i) { return !S.shopping.done[i.key]; }));
        try { if (navigator.share) { navigator.share({ title: "Einkaufsliste", text: txt }).catch(function () {}); break; } } catch (x) { /* weiter */ }
        copy(txt, "Einkaufsliste kopiert"); break;
      case "share-recipe":
        var r = S.recipes[id].recipe, t = K.toCookidoo(r).fullText.replace(/^.*\n/, titleOf(S.recipes[id]) + "\n");
        try { if (navigator.share) { navigator.share({ title: titleOf(S.recipes[id]), text: t }).catch(function () {}); break; } } catch (x) { /* weiter */ }
        copy(t, "Rezept kopiert"); break;
      case "pantry": var on = el.getAttribute("aria-checked") !== "true"; setHave(el.dataset.k, on); el.setAttribute("aria-checked", String(on)); break;
      case "rename": renameSheet(id); break;
      case "rename-save": var nt = ($("#newtitle").value || "").trim(); if (nt) { S.recipes[id].userTitle = nt; S.recipes[id].updatedAt = Date.now(); save("recipes"); } closeSheet(); render(); break;
      case "delete":
        if (!el.dataset.ok) { confirmSheet("Rezept löschen?", "delete", id, "Löschen"); break; }
        delete S.recipes[id]; S.shopping.list = S.shopping.list.filter(function (x) { return x.id !== id; }); save("recipes"); save("shopping"); UI.detail = null; closeSheet(); render(); toast("Gelöscht"); break;
      case "zuordnen": zuordnenSheet(id, el.dataset.name); break;
      case "zuord-pick":
        var s = UI.sug[+el.dataset.n]; S.zuord[el.dataset.key] = s.entry; save("zuord");
        Object.keys(S.recipes).forEach(function (k) { var rr = S.recipes[k].recipe; if (rr.ingredients.some(function (i) { return i.key === el.dataset.key; })) K.berechneNaehrwerte(rr, NW, null, { zuordnungen: S.zuord }); });
        save("recipes"); closeSheet(); render(); toast("Zugeordnet: " + s.name); break;
      case "analyse":
        var txt2 = ($("#paste").value || "").trim(); UI.pasteText = txt2;
        if (!txt2) { toast("Bitte erst Text einfügen"); break; }
        if (/^https?:\/\/(www\.)?instagram\.com\/\S+$/i.test(txt2)) {
          // Link aus Instagram („Link kopieren“): der Kurzbefehl holt die Beschreibung und kommt zurück
          if (S.meta.shortcutOk) { UI.pasteText = ""; runShortcut(txt2); break; }
          sheet('<h2>Link erkannt</h2><p class="small">Den Text hinter dem Link holt der Kurzbefehl „' + SC_NAME + '“. Ist er schon eingerichtet, starte ihn direkt. Sonst richte ihn einmal ein.</p>' +
            '<button class="btn accent" data-a="sc-run-link" data-t="' + esc(txt2) + '">' + ic("play") + 'Kurzbefehl starten</button><button class="btn" data-a="setup">Einrichten</button><button class="btn soft" data-a="close-sheet">Schließen</button>');
          break;
        }
        var emb2 = /Gefällt|Liked by|class="Caption"/.test(txt2) ? K.parseInstagramEmbed(txt2) : null;
        startDraft({ caption: emb2 ? emb2.caption : txt2, account: emb2 ? emb2.account : "", url: "" }); render(); break;
      case "drop-draft": UI.draft = null; UI.pasteText = ""; render(); break;
      case "save-draft":
        var d = UI.draft, nt2 = ($("#dtitle").value || "").trim();
        var out = addRecipe(d.res, { input: d.input });
        if (out.dupe) { toast("Das Rezept ist schon im Rezeptbuch"); UI.draft = null; UI.detail = out.id; render(); break; }
        if (nt2 && nt2 !== d.res.recipe.title) S.recipes[out.id].userTitle = nt2;
        save("recipes"); UI.draft = null; UI.pasteText = ""; UI.detail = out.id; render(); window.scrollTo(0, 0); toast("Gespeichert");
        var acc = d.res.recipe.source.account;
        if (acc) { var fv = K.folgenVorschlag(S.follow, acc); save("follow"); if (fv.fragen) setTimeout(function () { followSheet(acc); }, 500); }
        break;
      case "follow-yes": K.folgenAntwort(S.follow, el.dataset.acc, "gefolgt"); save("follow"); setTimeout(closeSheet, 300); break;
      case "follow-ans": K.folgenAntwort(S.follow, el.dataset.acc, el.dataset.v); save("follow"); closeSheet(); break;
      case "import-commit":
        var n2 = 0; UI.importRes.neu.forEach(function (x) { var o = addRecipe(x.res, { input: { caption: x.p.caption, url: x.p.url, account: x.p.account, ownerUrl: x.p.ownerUrl }, typ: x.like.typ }); if (!o.dupe) n2++; });
        save("recipes"); UI.importRes = null; UI.tab = "rezepte"; render(); toast(n2 + " Rezepte übernommen"); break;
      case "import-drop": UI.importRes = null; render(); break;
      case "backup": doBackup(); break;
    }
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "q") { UI.q = ev.target.value; var pos = ev.target.selectionStart; render(); var q = $("#q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) { /* egal */ } } }
    if (ev.target.id === "paste") UI.pasteText = ev.target.value;
    if (ev.target.id === "pname") { S.prefs.name = ev.target.value.trim().slice(0, 30); save("prefs"); }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "expfile") handleExportFiles(ev.target.files);
    if (ev.target.id === "restorefile" && ev.target.files[0]) ev.target.files[0].text().then(restore);
  });
  document.addEventListener("keydown", function (ev) {
    if (UI.cook) { if (ev.key === "Escape") endCook(); if (ev.key === "ArrowRight" && UI.cook.step < cookList(S.recipes[UI.cook.id].recipe).length - 1) { UI.cook.step++; renderCook(); } if (ev.key === "ArrowLeft" && UI.cook.step > 0) { UI.cook.step--; renderCook(); } return; }

  });
  window.addEventListener("hashchange", function () { if (readHashImport()) render(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && S.meta.trPending) render(); });

  // ------------------------------------------------------------------ Start
  dbOpen().then(function () {
    return Promise.all(["recipes", "pantry", "shopping", "follow", "zuord", "meta", "prefs"].map(function (k) { return dbGet(k).then(function (v) { if (v) S[k] = (k === "meta" || k === "prefs") ? Object.assign(S[k], v) : v; }); }));
  }).then(function () {
    applyTheme();
    seedExamples();

    readHashImport();
    render();
    if (upd) toast(upd + (upd === 1 ? " Rezept" : " Rezepte") + " mit der verbesserten Erkennung neu ausgewertet");
    setTimeout(meldeUnbekannte, 3000);
  });
  if ("serviceWorker" in navigator && /^https:/.test(location.protocol) && !/claude/.test(location.hostname)) {
    try {
      var hadSW = !!navigator.serviceWorker.controller, reloaded = false;
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (reg) {
        // Beim Zurückkehren in die App nach einer neuen Fassung schauen
        document.addEventListener("visibilitychange", function () { if (!document.hidden) { try { reg.update(); } catch (x) { /* egal */ } } });
      }).catch(function () {});
      // Neue Fassung übernommen: einmal neu laden (nicht beim allerersten Start, nicht mitten im Kochmodus)
      navigator.serviceWorker.addEventListener("controllerchange", function () { if (hadSW && !reloaded && !UI.cook && !$("#layer").innerHTML) { reloaded = true; location.reload(); } });
    } catch (e) { /* offline-Funktion optional */ }
  }
})();
