<style>
/* Layout: eine Spalte wie eine Banking-App. Großer Seitentitel, darunter gruppierte Listen
   auf hellen Flächen mit feinen Trennlinien, große Zahlen für Zeit und kcal, Tab-Leiste unten.
   Monochrom; ein ruhiges Grün nur für Aktionen und "vorhanden". Systemschrift (kein Abruf bei Google). */
:root {
  --bg: #F4F5F3; --surface: #FFFFFF; --surface-2: #ECEEEB; --ink: #121513; --muted: #646B66; --line: #E3E6E2;
  --accent: #0B7A55; --accent-ink: #FFFFFF; --accent-soft: #E1F0E9; --warn: #9A5B00; --warn-soft: #F7EEDC; --danger: #B3261E;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system-headline, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  --r-group: 16px; --r-ctl: 12px;
  --tabbar-h: 60px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --surface: #121513; --surface-2: #1C201D; --ink: #F1F3F1; --muted: #8F9791; --line: #242925;
  --accent: #3DC48F; --accent-ink: #04140D; --accent-soft: #10271D; --warn: #E3A94A; --warn-soft: #2A2113; --danger: #FF8A80; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --surface: #121513; --surface-2: #1C201D; --ink: #F1F3F1; --muted: #8F9791; --line: #242925;
  --accent: #3DC48F; --accent-ink: #04140D; --accent-soft: #10271D; --warn: #E3A94A; --warn-soft: #2A2113; --danger: #FF8A80; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 640px; margin: 0 auto; padding-block: 8px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.topbar h1 { margin: 0; font-family: var(--font-display); font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; text-wrap: balance; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; color: var(--ink); flex: none; }
.iconbtn svg { width: 22px; height: 22px; }
h2 { margin: 0; font-size: 1.05rem; font-weight: 650; letter-spacing: -0.01em; }
.sec { display: grid; gap: 8px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-inline: 4px; }
.sec-head .link { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 0.95rem; padding: 6px 0; }
.muted { color: var(--muted); } .small { font-size: 0.875rem; } .tiny { font-size: 0.78rem; }
.num { font-variant-numeric: tabular-nums; }

/* Gruppierte Liste (eine Fläche, Zeilen mit Trennlinie) */
.group { background: var(--surface); border-radius: var(--r-group); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 56px; width: 100%; text-align: left; background: none; border: 0; position: relative; }
.row + .row::before, .row + .rowwrap::before, .rowwrap + .row::before, .rowwrap + .rowwrap::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
.rowwrap { position: relative; }
.row .main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row .title { font-weight: 600; overflow-wrap: anywhere; }
.row .sub { font-size: 0.85rem; color: var(--muted); overflow-wrap: anywhere; }
.row .end { flex: none; text-align: right; display: grid; gap: 1px; justify-items: end; }
.row .big { font-size: 1.05rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.row > svg { width: 22px; height: 22px; flex: none; color: var(--muted); }
.row > svg.chev, .chev { width: 16px; height: 16px; color: var(--muted); flex: none; }

/* Suche + Filter */
.search { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: var(--r-ctl); padding: 0 12px; min-height: 44px; }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; outline: none; font-size: 1rem; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: -4px; padding-inline: 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 0.9rem; min-height: 36px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .count { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .count { color: inherit; opacity: 0.7; }
.filtergroup { display: grid; gap: 6px; }
.filtergroup .lbl { font-size: 0.8rem; color: var(--muted); padding-inline: 4px; }

/* Rezeptkarte in der Liste */
.thumb { width: 46px; height: 46px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; flex: none; color: var(--muted); font-weight: 700; font-size: 1.05rem; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.badge.ok { background: var(--accent-soft); color: var(--accent); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }

/* Knöpfe */
a.btn { text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r-ctl); min-height: 50px; padding: 12px 18px; font-weight: 650; font-size: 1rem; background: var(--ink); color: var(--bg); width: 100%; }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.soft { background: var(--surface-2); color: var(--ink); }
.btn.ghost { background: none; color: var(--accent); min-height: 44px; }
.btn.danger { background: none; color: var(--danger); }
.btn svg { width: 20px; height: 20px; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Anleitung beim ersten Gebrauch */
.guide { background: var(--surface); border-radius: var(--r-group); padding: 16px; display: grid; gap: 12px; border: 1px solid var(--line); }
.guide h3 { margin: 0; font-size: 1rem; }
.guide ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.guide li { display: flex; gap: 12px; align-items: flex-start; font-size: 0.93rem; }
.guide .gi { width: 32px; height: 32px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.guide .gi svg { width: 18px; height: 18px; }
.guide .btn { min-height: 44px; }

/* Detail */
.hero { display: grid; gap: 10px; }
.hero h1 { margin: 0; font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: var(--r-group); }
.fact { padding: 14px 12px; display: grid; gap: 2px; text-align: center; }
.fact + .fact { border-left: 1px solid var(--line); }
.fact b { font-size: 1.45rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; line-height: 1.15; }
.fact span { font-size: 0.78rem; color: var(--muted); }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface); font-size: 1.2rem; font-weight: 600; display: grid; place-items: center; }
.stepper output { min-width: 3.2em; text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
.ing .qty { width: 5.2em; flex: none; font-weight: 650; font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 2px solid var(--line); }
.dot.have { background: var(--accent); border-color: var(--accent); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px 16px; position: relative; }
.steps li + li::before { content: ""; position: absolute; top: 0; left: 54px; right: 0; height: 1px; background: var(--line); }
.steps .n { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 0.82rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.nutri { display: grid; grid-template-columns: repeat(4, 1fr); }
.nutri div { padding: 12px 8px; text-align: center; display: grid; gap: 2px; }
.nutri b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.nutri span { font-size: 0.75rem; color: var(--muted); }
.labels { display: grid; gap: 10px; padding: 14px 16px; }
.labels .lg { display: grid; grid-template-columns: 8.5em 1fr; gap: 8px; align-items: baseline; font-size: 0.9rem; }
.labels .lg > span:first-child { color: var(--muted); font-size: 0.82rem; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 0.82rem; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); }
.note { background: var(--warn-soft); color: var(--ink); border-radius: var(--r-group); padding: 12px 14px; font-size: 0.9rem; display: grid; gap: 6px; }
.note.info { background: var(--accent-soft); }
.field { display: grid; gap: 6px; }
.field label { font-size: 0.85rem; color: var(--muted); padding-inline: 4px; }
.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-ctl); padding: 12px 14px; min-height: 48px; font-size: 1rem; outline: none; }
textarea.input { min-height: 140px; resize: vertical; line-height: 1.4; }
.input:focus { border-color: var(--accent); }

/* Einkauf */
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: none; flex: none; display: grid; place-items: center; color: var(--accent-ink); padding: 0; }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.check svg { width: 14px; height: 14px; }
.row.done .title { color: var(--muted); text-decoration: line-through; }
.toggle { position: relative; width: 51px; height: 31px; border-radius: 999px; background: var(--surface-2); border: 0; flex: none; transition: background .15s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }

/* Tab-Leiste */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabbar nav { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); }
.tab { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: 0.7rem; font-weight: 600; position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab .pill { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 0.68rem; display: grid; place-items: center; padding: 0 5px; font-variant-numeric: tabular-nums; }

/* Blatt von unten (Dialoge) */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 30; display: grid; align-items: end; }
.sheet { background: var(--bg); border-radius: 20px 20px 0 0; max-height: 88vh; overflow-y: auto; padding-block: 10px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; max-width: 640px; width: 100%; margin: 0 auto; }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheet h2 { font-size: 1.25rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  background: var(--ink); color: var(--bg); border-radius: 999px; padding: 10px 18px; font-size: 0.92rem; font-weight: 600; max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 40px; height: 40px; color: var(--muted); }
.banner { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--r-group); padding: 12px 14px; border: 1px solid var(--line); }
.banner > svg { width: 24px; height: 24px; flex: none; color: var(--accent); }
.banner .main { flex: 1; min-width: 0; font-size: 0.9rem; }
.banner .btn { width: auto; min-height: 40px; padding: 8px 14px; font-size: 0.9rem; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.foot { font-size: 0.78rem; color: var(--muted); padding-inline: 4px; display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (min-width: 700px) { .topbar h1 { font-size: 2.25rem; } }
</style>

    var y = Array.isArray(node.recipeYield) ? node.recipeYield.map(textOf).join(" ") : textOf(node.recipeYield);
    r.servings = num(y);
    var ings = node.recipeIngredient || node.ingredients || [];
    if (!Array.isArray(ings)) ings = [ings];
    r.ingredients = ings.map(function (s) { return parseIngredientLine(textOf(s)); }).filter(Boolean);
    r.steps = flattenInstructions(node.recipeInstructions);
    r.timePrep = parseDuration(textOf(node.prepTime));
    r.timeCook = parseDuration(textOf(node.cookTime));
    r.timeTotal = parseDuration(textOf(node.totalTime)) || ((r.timePrep || 0) + (r.timeCook || 0)) || null;
    var cats = [].concat(node.recipeCategory || []).map(textOf).filter(Boolean);
    r.blogCategory = cats.join(", ");
    r.cuisine = [].concat(node.recipeCuisine || []).map(textOf).filter(Boolean).join(", ");
    r.keywords = textOf(node.keywords);
    r.blogDiets = [].concat(node.suitableForDiet || []).map(function (d) {
      return String(textOf(d) || d).replace(/^https?:\/\/schema\.org\//i, "");
    });
    if (node.nutrition) {
      var n = node.nutrition;
      r.nutritionDeclared = {
        kcal: num(n.calories), protein: num(n.proteinContent), carbs: num(n.carbohydrateContent),
        fat: num(n.fatContent), fiber: num(n.fiberContent), sugar: num(n.sugarContent), salt: num(n.sodiumContent),
        perServing: true, basis: "laut Blog"
      };
    }
    var author = node.author && (Array.isArray(node.author) ? node.author[0] : node.author);
    r.source.blogUrl = textOf(node.url) || pageUrl || "";
    r.source.blogAuthor = textOf(author);
    markProvenance(r, "blog");
    return r;
  }

  // ---------------------------------------------------------------------------
  // Klassifizierung (ohne LLM)
  // ---------------------------------------------------------------------------

  function classify(r) {
    var ingText = r.ingredients.map(function (i) {
      if (/(^|,\s*)(v|vegan|vegane?r?|pflanzlich)(\s*,|$)/i.test(i.note || "")) return "vegan " + lower(i.name);
      return lower(i.name + " " + (i.note || ""));
    }).join(" | ");
    var allText = lower(r.title + " | " + ingText + " | " + r.steps.join(" | ") + " | " + (r.keywords || "") + " | " + (r.blogCategory || ""));

    // Ernährungsstil
    var diet = [];
    if (r.ingredients.length >= 2) {
      var meat = matchWithExceptions(ingText, DICT.meat, NOT_ANIMAL);
      var fish = matchWithExceptions(ingText, DICT.fish, NOT_ANIMAL);
      var dairy = matchWithExceptions(ingText, DICT.dairy, NOT_ANIMAL);
      var egg = matchWithExceptions(ingText, DICT.egg, NOT_ANIMAL);
      var honey = matchWithExceptions(ingText, DICT.honey, NOT_ANIMAL);
      if (!meat && !fish && !dairy && !egg && !honey) diet.push("vegan");
      if (!meat && !fish) diet.push("vegetarisch");
      else if (!meat && fish) diet.push("pescetarisch");
      else diet.push("mit Fleisch");
      r.dietEvidence = { meat: meat, fish: fish, dairy: dairy, egg: egg, honey: honey };
    }
    r.diet = diet;

    // Allergene
    var allergens = [];
    Object.keys(ALLERGENS).forEach(function (a) {
      if (matchWithExceptions(ingText, ALLERGENS[a], ALLERGEN_EXCEPTIONS[a])) allergens.push(a);
    });
    if (/glutenfrei|gluten.?free/.test(allText)) allergens = allergens.filter(function (a) { return a !== "Gluten"; });
    r.allergens = allergens;

    // Kategorie: Titel zählt dreifach
    var best = null, bestScore = 0, scores = {};
    var title = lower(r.title + " " + (r.titleOriginal || ""));
    CATEGORY_KEYWORDS.forEach(function (c) {
      var score = 0;
      c[1].forEach(function (k) {
        if (title.indexOf(k) !== -1) score += 3;
        else if (allText.indexOf(k) !== -1) score += (c[0] === "Hauptgericht" ? 0.6 : c[0] === "Sauce & Dip" || c[0] === "Suppe & Eintopf" || c[0] === "Getränk" ? 0.4 : 1);
      });
      scores[c[0]] = score;
      if (score > bestScore) { bestScore = score; best = c[0]; }
    });
    // Backen-Muster: Mehl + Backtriebmittel + Ofen
    if (bestScore < 3 && /mehl|flour/.test(ingText) && /(backpulver|natron|hefe|baking powder|yeast)/.test(ingText) && /(ofen|oven|backen|bake)/.test(allText) && /zucker|sugar|sirup|honig/.test(ingText)) best = "Backen";
    r.category = best || "Hauptgericht";
    r.categoryAlso = Object.keys(scores).filter(function (c) { return c !== r.category && scores[c] >= 3; });
    r.categoryBasis = best ? "Stichworte" : "Standard";

    // Geräte
    var full = r.title + " " + r.steps.join(" ");
    r.equipment = EQUIPMENT.filter(function (e) { return e[1].test(full); }).map(function (e) { return e[0]; });
    if (!r.equipment.length && r.steps.length) r.equipment = ["ohne Kochen"];

    // Schwierigkeit (Heuristik)
    var score = r.steps.length + r.ingredients.length / 3;
    if (TECHNIQUES.test(full)) score += 4;
    if ((r.timeTotal || 0) > 90) score += 3;
    r.difficulty = score <= 8 ? "einfach" : score <= 14 ? "mittel" : "anspruchsvoll";

    // Ernährungsfokus: erst einmal nur aus deklarierten Nährwerten (Blog) nach EU-Schwellen.
    // Mit der BLS-Datenbank wird das später für jedes Rezept berechnet.
    r.focus = focusFromNutrition(r.nutritionDeclared, r.nutritionDeclared ? r.nutritionDeclared.basis : "");
    (r.creatorClaims || []).forEach(function (c) {
      if (["proteinreich", "kalorienarm", "low-carb", "meal-prep"].indexOf(c) !== -1 && !r.focus.some(function (f) { return f.label === c; })) {
        r.focus.push({ label: c, basis: "laut Creator" });
      }
    });
    return r;
  }

  // Schwellen angelehnt an die EU-Regeln für nährwertbezogene Angaben (VO (EG) 1924/2006, Anhang)
  // und die Nährstoffbezugswerte (NRV) der LMIV. "hoher Gehalt" = mind. 30 % NRV – hier je Portion.
  //   proteinreich      ≥ 20 % der Energie aus Protein
  //   ballaststoffreich ≥ 3 g je 100 kcal
  //   eisenreich        ≥ 4,2 mg (30 % von 14 mg)
  //   calciumreich      ≥ 240 mg (30 % von 800 mg)
  //   magnesiumreich    ≥ 112,5 mg (30 % von 375 mg)
  //   vitamin-C-reich   ≥ 24 mg (30 % von 80 mg)
  //   omega-3-reich     ≥ 0,6 g Omega-3 je 100 kcal
  var FOCUS_RULES = [
    ["proteinreich", function (n) { return n.protein != null && (n.protein * 4) / n.kcal >= 0.2; }],
    ["ballaststoffreich", function (n) { return n.fiber != null && n.fiber / (n.kcal / 100) >= 3; }],
    ["eisenreich", function (n) { return n.iron != null && n.iron >= 4.2; }],
    ["calciumreich", function (n) { return n.calcium != null && n.calcium >= 240; }],
    ["magnesiumreich", function (n) { return n.magnesium != null && n.magnesium >= 112.5; }],
    ["vitamin-C-reich", function (n) { return n.vitC != null && n.vitC >= 24; }],
    ["omega-3-reich", function (n) { return n.omega3 != null && n.omega3 / (n.kcal / 100) >= 0.6; }]
  ];
  function focusFromNutrition(n, basis) {
    var out = [];
    if (!n || !n.kcal) return out;
    FOCUS_RULES.forEach(function (r) { if (r[1](n)) out.push({ label: r[0], basis: basis }); });
    return out;
  }

  // ---------------------------------------------------------------------------
  // Vollständigkeit, Zusammenführen, Analyse-Kette
  // ---------------------------------------------------------------------------

  function emptyRecipe() {
    return {
      schema: SCHEMA_VERSION, title: "", servings: null, ingredients: [], steps: [],
      timeTotal: null, timePrep: null, timeCook: null, timeEstimated: false,
      category: "", diet: [], allergens: [], difficulty: "", focus: [], equipment: [],
      source: { url: "", account: "", blogUrl: "" }, links: [], linkInBio: false,
      creatorClaims: [], provenance: {}
    };
  }

  function markProvenance(r, src) {
    ["title", "servings", "ingredients", "steps", "timeTotal"].forEach(function (f) {
      var v = r[f];
      if (v != null && v !== "" && !(Array.isArray(v) && !v.length)) r.provenance[f] = src;
    });
  }

  function ingredientQuality(list) {
    if (!list || !list.length) return 0;
    var withQty = list.filter(function (i) { return i.qty != null || /prise|etwas|nach geschmack|to taste|optional/i.test(i.raw); }).length;
    return list.length * (0.4 + 0.6 * (withQty / list.length));
  }

  /**
   * Wie vollständig ist das Rezept? score 0–100, missing = fehlende Teile,
   * enough = genug zum Kochen (Zutaten + Schritte).
   */
  function completeness(r) {
    var missing = [], score = 0;
    var ingOk = r.ingredients.length >= 3 && ingredientQuality(r.ingredients) >= r.ingredients.length * 0.7;
    var stepsOk = r.steps.length >= 2 || (r.steps.length === 1 && r.steps[0].length > 120);
    if (r.title) score += 10; else missing.push("Titel");
    if (ingOk) score += 40;
    else { missing.push(r.ingredients.length >= 3 ? "Mengenangaben" : "Zutaten"); score += Math.min(25, r.ingredients.length * 5); }
    if (stepsOk) score += 30; else { missing.push("Zubereitung"); score += r.steps.length * 10; }
    if (r.servings) score += 10; else missing.push("Portionen");
    if (r.timeTotal) score += 10; else missing.push("Dauer");
    return { score: Math.min(100, score), missing: missing, enough: ingOk && stepsOk };
  }

  // Füllt Lücken in a mit Werten aus b. a hat Vorrang, außer b ist klar besser.
  function merge(a, b, src) {
    if (!b) return a;
    var r = a;
    ["title", "servings", "timeTotal", "timePrep", "timeCook", "cuisine", "keywords", "blogCategory", "nutritionDeclared",
      "elsewhere", "bakingForm", "yieldInfo", "servingsUnit", "ingredientsFromSteps", "hashtagTitle"].forEach(function (f) {
      if ((r[f] == null || r[f] === "") && b[f] != null && b[f] !== "") { r[f] = b[f]; r.provenance[f] = src; }
    });
    if (ingredientQuality(b.ingredients) > ingredientQuality(r.ingredients) * 1.15) {
      r.ingredients = b.ingredients; r.provenance.ingredients = src;
    }
    var bLen = b.steps.join(" ").length, aLen = r.steps.join(" ").length;
    if (b.steps.length > r.steps.length && bLen > aLen * 1.1) { r.steps = b.steps; r.provenance.steps = src; }
    r.links = uniq((r.links || []).concat(b.links || []));
    r.creatorClaims = uniq((r.creatorClaims || []).concat(b.creatorClaims || []));
    r.linkInBio = r.linkInBio || b.linkInBio;
    r.thermomixSettings = r.thermomixSettings || b.thermomixSettings;
    if (b.source) Object.keys(b.source).forEach(function (k) { if (!r.source[k] && b.source[k]) r.source[k] = b.source[k]; });
    return r;
  }

  function uniq(a) { var s = {}; return a.filter(function (x) { if (s[x]) return false; s[x] = 1; return true; }); }

  var STEP_NAMES = {
    blog: "Blog-Rezeptdaten", caption: "Caption", ocr: "Texterkennung", comment: "Kommentar", speech: "Spracherkennung", model: "Lokales Modell"
  };

  /**
   * Die Analyse-Kette. Synchron für alles außer dem optionalen Modell.
   *
   * input = {
   *   url, account,            // Instagram-Post
   *   caption,                 // Text der Caption
   *   blogHtml | blogJson,     // Rezeptseite (vom Kurzbefehl/der App geholt)
   *   blogUrl,
   *   ocrText,                 // Text aus Screenshots/Videobildern
   *   transcript               // gesprochener Text
   * }
   * Gibt { recipe, trace, completeness, next } zurück.
   * next sagt der Oberfläche, was als Nächstes helfen würde (sparsamster Schritt zuerst).
   */
  function analyse(input) {
    input = input || {};
    var t0 = now();
    var trace = [];
    var r = emptyRecipe();
    r.source.url = input.url || "";
    r.source.account = (input.account || "").replace(/^@/, "");

    function step(name, available, fn) {
      var before = completeness(r);
      if (before.enough && name !== "caption") {
        trace.push({ step: name, label: STEP_NAMES[name], status: "übersprungen", reason: "Rezept war schon vollständig" });
        return;
      }
      if (!available) { trace.push({ step: name, label: STEP_NAMES[name], status: "nicht verfügbar" }); return; }
      var s = now();
      var part = fn();
      if (!part) { trace.push({ step: name, label: STEP_NAMES[name], status: "nichts gefunden", ms: now() - s }); return; }
      var hadTitle = !!r.title;
      merge(r, part, name);
      if (!hadTitle && part.title) r.title = part.title;
      var after = completeness(r);
      trace.push({ step: name, label: STEP_NAMES[name], status: "verwendet", gained: after.score - before.score, ms: now() - s });
    }

    // 1. Blog (wenn vorhanden): exakteste Quelle
    step("blog", !!(input.blogHtml || input.blogJson), function () {
      return input.blogJson ? parseSchemaOrg(input.blogJson, input.blogUrl) : parseRecipeHtml(input.blogHtml, input.blogUrl);
    });
    // 2. Caption: läuft immer, liefert auch Links, Creator-Angaben und Bio-Hinweis
    step("caption", !!input.caption, function () { return parseText(input.caption, "caption"); });
    // 3. Texterkennung
    step("ocr", !!input.ocrText, function () { return parseText(input.ocrText, "ocr"); });
    // Angepinnter Kommentar mit dem Rezept (vom Nutzer kopiert)
    step("comment", !!input.commentText, function () { return parseText(input.commentText, "comment"); });
    // 4. Spracherkennung
    step("speech", !!input.transcript, function () { return parseTranscript(input.transcript); });

    finalize(r);
    var c = completeness(r);
    return { recipe: r, trace: trace, completeness: c, next: suggestNext(r, c, input), ms: now() - t0, version: VERSION };
  }

  /**
   * Optionaler 5. Schritt: ein lokales Modell. Der Kern ruft es nur auf, wenn
   * die Regeln nicht gereicht haben. modelFn(prompt) muss ein Promise mit
   * JSON-Text liefern (z. B. EuroLLM im Browser oder Apples Modell in der App).
   */
  function analyseWithModel(input, modelFn) {
    var res = analyse(input);
    if (res.completeness.enough || typeof modelFn !== "function") return Promise.resolve(res);
    var text = [input.caption, input.ocrText, input.transcript].filter(Boolean).join("\n\n").slice(0, 6000);
    return Promise.resolve(modelFn(buildModelPrompt(text, res.completeness.missing))).then(function (out) {
      var parsed = typeof out === "string" ? safeJson(out) : out;
      if (!parsed) { res.trace.push({ step: "model", label: STEP_NAMES.model, status: "keine gültige Antwort" }); return res; }
      var part = emptyRecipe();
      part.title = clean(parsed.title || "");
      part.servings = num(parsed.servings);
      part.timeTotal = num(parsed.timeTotal);
      part.ingredients = (parsed.ingredients || []).map(function (s) {
        return parseIngredientLine(typeof s === "string" ? s : [s.qty, s.unit, s.name].filter(Boolean).join(" "));
      }).filter(Boolean);
      part.steps = (parsed.steps || []).map(String).map(cleanStep).filter(Boolean);
      var before = res.completeness.score;
      merge(res.recipe, part, "model");
      finalize(res.recipe);
      res.completeness = completeness(res.recipe);
      res.trace.push({ step: "model", label: STEP_NAMES.model, status: "verwendet", gained: res.completeness.score - before });
      res.next = suggestNext(res.recipe, res.completeness, input);
      return res;
    }, function () {
      res.trace.push({ step: "model", label: STEP_NAMES.model, status: "Fehler" });
      return res;
    });
  }

  function buildModelPrompt(text, missing) {
    return "Extrahiere aus dem folgenden Text ein Kochrezept auf Deutsch. Antworte NUR mit JSON: " +
      '{"title": string, "servings": number, "timeTotal": number (Minuten), ' +
      '"ingredients": ["200 g Linsen", ...], "steps": ["...", ...]}. ' +
      "Erfinde nichts, was nicht im Text steht. Fehlend sind vor allem: " + missing.join(", ") + ".\n\nText:\n" + text;
  }

  function safeJson(s) {
    try { return JSON.parse(s); } catch (e) {
      var m = String(s).match(/\{[\s\S]*\}/);
      if (m) { try { return JSON.parse(m[0]); } catch (e2) { return null; } }
      return null;
    }
  }

    "Overnight Oats mit Himbeeren\nZutaten:\n50 g Haferflocken\n150 ml Haferdrink\n100 g Sojajoghurt\n1 EL Chiasamen\n80 g Himbeeren\n1 TL Ahornsirup\nZubereitung:\n1. Haferflocken, Haferdrink, Joghurt und Chiasamen verrühren.\n2. Über Nacht in den Kühlschrank stellen.\n3. Morgens mit Himbeeren und Ahornsirup servieren.",
    "Ofengemüse mit Feta\nFür 2 Portionen\nZutaten:\n400 g Kartoffeln\n1 rote Paprika\n1 Zucchini\n1 rote Zwiebel\n200 g Feta\n3 EL Olivenöl\n1 TL Paprikapulver\nSalz, Pfeffer\nZubereitung:\n1. Ofen auf 200 °C Umluft vorheizen.\n2. Gemüse würfeln, mit Öl und Gewürzen mischen und auf einem Blech 30 Minuten backen.\n3. Feta zerbröseln, darüber geben und weitere 5 Minuten backen.",
    "Lemon Garlic Pasta\nServes 2\nIngredients:\n200 g spaghetti\n1 lemon, zested and juiced\n3 tbsp olive oil\n3 cloves garlic, thinly sliced\n30 g parmesan\n1 handful fresh parsley\nInstructions:\n1. Cook the pasta in salted water, reserving 1 cup of pasta water.\n2. Gently fry the garlic in the olive oil for 2 minutes.\n3. Toss the pasta with garlic oil, lemon, parmesan and some pasta water until creamy.\n4. Finish with parsley and black pepper."
  ];
  function seedExamples() {
    if (S.meta.examples || Object.keys(S.recipes).length) return;
    EXAMPLES.forEach(function (c, n) {
      var res = K.analyse({ caption: c, url: "", account: "" });
      var r = res.recipe; r.source.url = ""; r.source.account = "";
      var out = addRecipe(res, { example: true, input: { caption: c } });
      if (S.recipes[out.id]) S.recipes[out.id].addedAt = Date.now() - n * 1000;
    });
    S.meta.examples = true; save("meta"); save("recipes");
  }

  // ------------------------------------------------------------------ Tabs
  var TABS = [["rezepte", "Rezepte", "book"], ["einkauf", "Einkauf", "bag"], ["vorrat", "Vorrat", "jar"], ["neu", "Hinzufügen", "plus"]];
  function renderTabs() {
    var shopCount = S.shopping.list.length ? shoppingItems().filter(function (i) { return !i.have && !S.shopping.done[i.key]; }).length : 0;
    $("#tabs").innerHTML = TABS.map(function (t) {
      var cur = UI.tab === t[0] && !UI.detail;
      return '<button class="tab" data-a="tab" data-t="' + t[0] + '"' + (cur ? ' aria-current="page"' : '') + '>' + ic(t[2]) + '<span>' + t[1] + '</span>' +
        (t[0] === "einkauf" && shopCount ? '<span class="pill">' + shopCount + '</span>' : '') + '</button>';
    }).join("");
  }
  function render() {
    renderTabs();
    var html = UI.detail ? viewDetail(UI.detail) : ({ rezepte: viewRezepte, einkauf: viewEinkauf, vorrat: viewVorrat, neu: viewNeu })[UI.tab]();
    $("#app").innerHTML = html;
  }

  // ------------------------------------------------------------------ Ansicht: Rezepte
  function backupBanner() {
    var due = S.meta.lastChange > S.meta.lastBackup && Date.now() - S.meta.lastBackup > 24 * 3600 * 1000 && Object.keys(S.recipes).some(function (id) { return !S.recipes[id].example; });
    if (!due) return "";
    return '<div class="banner">' + ic("cloud") + '<div class="main"><b>Sicherung fällig.</b> Seit der letzten Sicherung hat sich etwas geändert.</div><button class="btn accent" data-a="backup">Sichern</button></div>';
  }
  function setupBanner() {
    if (S.meta.setupAsked) return "";
    return '<div class="banner">' + ic("share") + '<div class="main"><b>Soll ich „Ins Rezeptbuch“ einrichten?</b> Dann landen Rezepte mit einem Tipp aus Instagram hier.</div><button class="btn accent" data-a="setup">Ja</button></div>';
  }
  function viewRezepte() {
    var all = entries();
    var q = UI.q.trim().toLowerCase();
    // Labels für Filter zählen (nach Gruppen, wichtigste zuerst)
    var counts = {};
    all.forEach(function (e) { (e.recipe.labels || []).forEach(function (l) { var k = l.gruppe + "|" + l.label; counts[k] = (counts[k] || 0) + 1; }); });
    var list = all.filter(function (e) {
      var r = e.recipe;
      for (var g in UI.filter) { if (UI.filter[g] && !(r.labels || []).some(function (l) { return l.gruppe === g && l.label === UI.filter[g]; })) return false; }
      if (!q) return true;
      var hay = (titleOf(e) + " " + (r.titleOriginal || "") + " " + r.source.account + " " + r.ingredients.map(function (i) { return i.name + " " + (i.nameOriginal || ""); }).join(" ") + " " + (r.labels || []).map(function (l) { return l.label; }).join(" ")).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    var groups = ["Gang", "Ernährung", "Zeit", "Hauptzutat", "Praktisch"];
    var filters = groups.map(function (g) {
      var opts = Object.keys(counts).filter(function (k) { return k.indexOf(g + "|") === 0; }).map(function (k) { return [k.split("|")[1], counts[k]]; })
        .sort(function (a, b) { return b[1] - a[1]; });
      if (opts.length < 2 && !UI.filter[g]) return "";
      return '<div class="filtergroup"><span class="lbl">' + esc(g) + '</span><div class="chips">' + opts.map(function (o) {
        var on = UI.filter[g] === o[0];
        return '<button class="chip" data-a="filter" data-g="' + esc(g) + '" data-v="' + esc(o[0]) + '" aria-pressed="' + on + '">' + esc(o[0]) + '<span class="count">' + o[1] + '</span></button>';
      }).join("") + '</div></div>';
    }).join("");
    var ex = all.some(function (e) { return e.example; });
    return '<header class="topbar"><h1>Rezepte</h1><button class="iconbtn" data-a="settings" aria-label="Einstellungen">' + ic("gear") + '</button></header>' +
      setupBanner() + backupBanner() + guide("rezepte") +
      '<label class="search"><span class="sr">Suche</span>' + ic("search") + '<input id="q" type="search" placeholder="Rezept, Zutat oder Creator" value="' + esc(UI.q) + '" autocomplete="off"></label>' +
      (all.length > 1 ? '<div class="sec">' + filters + '</div>' : '') +
      '<section class="sec"><div class="sec-head"><h2>' + list.length + (list.length === 1 ? " Rezept" : " Rezepte") + '</h2>' +
      (Object.keys(UI.filter).some(function (g) { return UI.filter[g]; }) ? '<button class="link" data-a="filter-reset">Filter löschen</button>' : '') + '</div>' +
      (list.length ? '<div class="group">' + list.map(recipeRow).join("") + '</div>' :
        '<div class="group empty">' + ic("book") + '<p><b>' + (all.length ? "Nichts gefunden." : "Noch keine Rezepte.") + '</b></p><p class="muted small">' + (all.length ? "Andere Suche oder weniger Filter probieren." : "Teile ein Rezept aus Instagram oder füge unter „Hinzufügen“ Text ein.") + '</p></div>') +
      '</section>' +
      (ex ? '<p class="foot">Die Rezepte mit „Beispiel“ sind Muster zum Ausprobieren. <button class="btn ghost" style="width:auto;display:inline;padding:0;min-height:0" data-a="remove-examples">Beispiele entfernen</button></p>' : '');
  }
  function recipeRow(e) {
    var r = e.recipe, t = titleOf(e);
    var sub = [];
    var gang = (r.labels || []).filter(function (l) { return l.gruppe === "Gang"; })[0];
    if (gang) sub.push(gang.label);
    var diet = (r.diet || [])[0]; if (diet) sub.push(diet);
    if (r.source.account) sub.push("@" + r.source.account);
    var badge = e.example ? '<span class="badge">Beispiel</span>' : (!K.completeness(r).enough ? '<span class="badge warn">unvollständig</span>' : '');
    return '<button class="row" data-a="open" data-id="' + esc(e.id) + '"><span class="thumb" aria-hidden="true">' + esc(initials(t)) + '</span>' +
      '<span class="main"><span class="title">' + esc(t) + '</span><span class="sub">' + esc(sub.join(" · ")) + '</span>' + (badge ? '<span>' + badge + '</span>' : '') + '</span>' +
      '<span class="end"><span class="big">' + (r.timeTotal ? fmtMin(r.timeTotal) : "–") + '</span><span class="tiny muted">' + (r.timeTotal ? (r.timeTotal < 60 ? "Min." : "Std.") : "Zeit") + '</span></span></button>';
  }

  // ------------------------------------------------------------------ Ansicht: Detail
  function viewDetail(id) {
    var e = S.recipes[id];
    if (!e) { UI.detail = null; return viewRezepte(); }
    var r = e.recipe, orig = !!UI.showOrig[id];
    var serv = UI.servings[id] || r.servings || 2;
    var base = r.servings || serv;
    var f = base ? serv / base : 1;
    var c = K.completeness(r);
    var n = r.nutrition;
    var translated = r.titleTranslated || r.ingredients.some(function (i) { return i.nameOriginal; });
    var ings = r.ingredients.map(function (i) {
      var q = i.qty != null ? K.fmtQty(i.qty * f) + (i.qtyMax != null ? "–" + K.fmtQty(i.qtyMax * f) : "") : "";
      var name = orig && i.nameOriginal ? i.nameOriginal : i.name;
      var have = haveKey(i.key);
      return '<div class="row ing"><span class="dot' + (have ? " have" : "") + '" title="' + (have ? "vorhanden" : "nicht vorhanden") + '"></span>' +
        '<span class="qty">' + esc(clean2(q + " " + (i.unit || ""))) + '</span><span class="main"><span>' + esc(name) + (i.optional ? ' <span class="muted small">(optional)</span>' : '') + '</span>' +
        (i.note ? '<span class="sub">' + esc(i.note) + '</span>' : '') + '</span></div>';
    }).join("");
    var steps = r.steps.map(function (s, k) { return '<li><span class="n">' + (k + 1) + '</span><span>' + esc(s) + '</span></li>'; }).join("");
    var labelGroups = {};
    (r.labels || []).forEach(function (l) { if (l.gruppe === "Gang") return; (labelGroups[l.gruppe] = labelGroups[l.gruppe] || []).push(l); });
    var labels = Object.keys(labelGroups).map(function (g) {
      return '<div class="lg"><span>' + esc(g) + '</span><span class="tags">' + labelGroups[g].map(function (l) { return '<span class="tag" title="' + esc(l.basis) + '">' + esc(l.label) + '</span>'; }).join("") + '</span></div>';
    }).join("");
    var nut = "";
    if (n && n.coverage.matched >= 2) {
      var v = n.values, per = n.perServing ? "pro " + (n.perUnit === "Stück" ? "Stück" : "Portion") : "für das ganze Rezept";
      nut = '<section class="sec"><div class="sec-head"><h2>Nährwerte</h2><span class="small muted">' + per + '</span></div><div class="group"><div class="nutri">' +
        [[v.kcal, "kcal"], [fmtG(v.protein), "Eiweiß g"], [fmtG(v.carbs), "Kohlenh. g"], [fmtG(v.fat), "Fett g"]].map(function (x) { return '<div><b>' + x[0] + '</b><span>' + x[1] + '</span></div>'; }).join("") + '</div>' +
        '<div class="row"><span class="main"><span class="sub">' + (n.reliable ? "Berechnet aus " + n.coverage.matched + " Zutaten." : "Nur teilweise berechnet: " + n.coverage.matched + " von " + (n.coverage.matched + n.coverage.unmatched.length) + " Zutaten bekannt.") +
        (r.servingsEstimated ? " Portionen geschätzt (" + esc(r.servingsBasis) + ")." : "") + '</span></span></div>' +
        (n.coverage.unmatched.length ? n.coverage.unmatched.map(function (u) { return '<button class="row" data-a="zuordnen" data-id="' + esc(id) + '" data-name="' + esc(u) + '"><span class="main"><span>' + esc(u) + '</span><span class="sub">Unbekannt. Einmal zuordnen, dann gilt es für alle Rezepte.</span></span>' + ic("chev", "chev") + '</button>'; }).join("") : "") +
        '</div></section>';
    }
    var src = r.source.url ? '<a class="row" href="' + esc(r.source.url) + '" target="_blank" rel="noopener"><span class="main"><span class="title">Original auf Instagram</span><span class="sub">' + (r.source.account ? "@" + esc(r.source.account) : "") + '</span></span>' + ic("chev", "chev") + '</a>' : "";
    var blog = r.source.blogUrl ? '<a class="row" href="' + esc(r.source.blogUrl) + '" target="_blank" rel="noopener"><span class="main"><span class="title">Rezept auf dem Blog</span><span class="sub">' + esc(String(r.source.blogUrl).replace(/^https?:\/\//, "").slice(0, 60)) + '</span></span>' + ic("chev", "chev") + '</a>' : "";
    var missing = !c.enough ? '<div class="note"><b>Noch unvollständig: ' + esc(c.missing.join(", ")) + '.</b><span>' + esc(nextHint(r, e)) + '</span></div>' : "";
    var unitWord = r.servingsUnit && r.servingsUnit !== "Portionen" && r.servingsUnit !== "Portion" ? r.servingsUnit : (serv === 1 ? "Portion" : "Portionen");
    return '<header class="topbar"><button class="iconbtn" data-a="back" aria-label="Zurück">' + ic("back") + '</button>' +
      '<div style="display:flex;gap:8px">' + (translated ? '<button class="iconbtn" data-a="orig" data-id="' + esc(id) + '" aria-pressed="' + orig + '" aria-label="Original zeigen" title="Original zeigen"><span style="font-weight:700;font-size:.8rem">' + (orig ? "DE" : "EN") + '</span></button>' : '') +
      '<button class="iconbtn" data-a="share-recipe" data-id="' + esc(id) + '" aria-label="Rezept teilen">' + ic("share") + '</button></div></header>' +
      '<section class="hero"><h1>' + esc(orig && r.titleOriginal ? r.titleOriginal : titleOf(e)) + '</h1>' +
      '<div class="tags">' + (r.labels || []).filter(function (l) { return l.gruppe === "Gang"; }).map(function (l) { return '<span class="tag">' + esc(l.label) + '</span>'; }).join("") +
      (r.titleGuessed ? '<span class="badge warn">Titel vorgeschlagen</span>' : '') + (e.example ? '<span class="badge">Beispiel</span>' : '') + '</div>' +
      '<button class="btn ghost" style="justify-content:flex-start;padding:0;min-height:32px;width:auto" data-a="rename" data-id="' + esc(id) + '">Titel ändern</button></section>' +
      '<div class="facts"><div class="fact"><b>' + fmtMin(r.timeTotal) + '</b><span>' + (r.timeTotal ? minUnit(r.timeTotal) + (r.timeEstimated ? " (geschätzt)" : "") : "Zeit unbekannt") + '</span></div>' +
      '<div class="fact"><b>' + (n && n.reliable && n.perServing ? n.values.kcal : "–") + '</b><span>kcal pro ' + (n && n.perUnit === "Stück" ? "Stück" : "Portion") + '</span></div>' +
      '<div class="fact"><b>' + esc(r.difficulty || "–") + '</b><span>Aufwand</span></div></div>' +
      guide("detail") + missing +
      '<section class="sec"><div class="sec-head"><h2>Zutaten</h2><span class="stepper" role="group" aria-label="Portionen"><button data-a="serv" data-id="' + esc(id) + '" data-d="-1" aria-label="Weniger">−</button><output>' + serv + " " + esc(unitWord) + '</output><button data-a="serv" data-id="' + esc(id) + '" data-d="1" aria-label="Mehr">+</button></span></div>' +
      (r.yieldText ? '<p class="small muted" style="padding-inline:4px">' + esc(r.yieldText) + '</p>' : '') +
      '<div class="group">' + (ings || '<div class="row"><span class="muted">Keine Zutaten erkannt.</span></div>') + '</div>' +
      '<button class="btn accent" data-a="to-list" data-id="' + esc(id) + '">' + ic("bag") + 'Auf die Einkaufsliste</button></section>' +
      (steps ? '<section class="sec"><div class="sec-head"><h2>Zubereitung</h2>' + (r.lang === "en" && !orig ? '<span class="small muted">noch auf Englisch</span>' : '') + '</div><div class="group"><ol class="steps">' + steps + '</ol></div></section>' : '') +
      nut +
      (labels ? '<section class="sec"><div class="sec-head"><h2>Labels</h2></div><div class="group labels">' + labels + '</div></section>' : '') +
      ((src || blog) ? '<section class="sec"><div class="sec-head"><h2>Quelle</h2></div><div class="group">' + src + blog + '</div></section>' : '') +
      '<button class="btn danger" data-a="delete" data-id="' + esc(id) + '">' + ic("trash") + 'Rezept löschen</button>' +
      (n ? '<p class="foot">' + esc(BLS_HINWEIS) + '</p>' : '');
  }
  function clean2(s) { return String(s).replace(/\s+/g, " ").trim(); }
  function fmtG(x) { return x == null ? "–" : String(x).replace(".", ","); }
  function nextHint(r, e) {
    var inp = (e && e.input) || {};
    var res = { recipe: r, completeness: K.completeness(r) };
    var nx = null;
    try { nx = K.analyse(Object.assign({}, inp, { url: r.source.url })).next; } catch (x) { nx = null; }
    return nx ? nx.hint : "Du kannst fehlende Angaben später ergänzen.";
  }

  // ------------------------------------------------------------------ Ansicht: Einkauf
  function shoppingItems() {
    var list = S.shopping.list.filter(function (x) { return S.recipes[x.id]; }).map(function (x) { return { recipe: S.recipes[x.id].recipe, servings: x.servings }; });
    if (!list.length) return [];
    return K.shoppingList(list, S.pantry, NW).map(function (it) { it.have = haveKey(it.key); return it; });
  }
  function viewEinkauf() {
    var items = shoppingItems();
    var need = items.filter(function (i) { return !i.have; }), have = items.filter(function (i) { return i.have; });
    var open = need.filter(function (i) { return !S.shopping.done[i.key]; }).length;
    var aisles = {};
    need.forEach(function (i) { (aisles[i.aisle] = aisles[i.aisle] || []).push(i); });
    var recs = S.shopping.list.filter(function (x) { return S.recipes[x.id]; });
    var body = !recs.length ? '<div class="group empty">' + ic("bag") + '<p><b>Die Einkaufsliste ist leer.</b></p><p class="muted small">Öffne ein Rezept und tippe auf „Auf die Einkaufsliste“.</p><button class="btn soft" style="width:auto" data-a="tab" data-t="rezepte">Zu den Rezepten</button></div>' :
      '<section class="sec"><div class="sec-head"><h2>Für ' + recs.length + (recs.length === 1 ? " Rezept" : " Rezepte") + '</h2><button class="link" data-a="clear-list">Liste leeren</button></div><div class="group">' +
      recs.map(function (x) {
        var e = S.recipes[x.id];
        return '<div class="row"><span class="main"><span class="title">' + esc(titleOf(e)) + '</span><span class="sub">' + x.servings + " " + (x.servings === 1 ? "Portion" : "Portionen") + '</span></span><button class="btn ghost" style="width:auto" data-a="unlist" data-id="' + esc(x.id) + '">Entfernen</button></div>';
      }).join("") + '</div></section>' +
      '<div class="btnrow"><button class="btn" data-a="copy-all">' + ic("copy") + 'Alles kopieren</button><button class="btn soft" data-a="share-list">' + ic("share") + 'Teilen</button></div>' +
      Object.keys(aisles).map(function (a) {
        return '<section class="sec"><div class="sec-head"><h2>' + esc(a) + '</h2><span class="small muted num">' + aisles[a].length + '</span></div><div class="group">' + aisles[a].map(shopRow).join("") + '</div></section>';
      }).join("") +
      (have.length ? '<section class="sec"><div class="sec-head"><h2>Schon zu Hause</h2><button class="link" data-a="toggle-have">' + (UI.showHave ? "Ausblenden" : have.length + " anzeigen") + '</button></div>' +
        (UI.showHave ? '<div class="group">' + have.map(function (i) {
          return '<div class="row"><span class="main"><span>' + esc(i.text) + '</span><span class="sub">' + esc(i.recipes.join(", ")) + '</span></span><button class="btn ghost" style="width:auto" data-a="need" data-k="' + esc(i.key) + '">Brauche ich</button></div>';
        }).join("") + '</div>' : '') + '</section>' : '');
    return '<header class="topbar"><h1>Einkauf</h1>' + (recs.length ? '<span class="small muted num">' + open + ' offen</span>' : '') + '</header>' + guide("einkauf") + body;
  }
  function shopRow(i) {
    var done = !!S.shopping.done[i.key];
    return '<div class="row' + (done ? " done" : "") + '"><button class="check" role="checkbox" aria-checked="' + done + '" data-a="done" data-k="' + esc(i.key) + '" aria-label="' + esc(i.name) + ' erledigt">' + ic("check") + '</button>' +
      '<button class="main" style="background:none;border:0;text-align:left;padding:0" data-a="copy-item" data-t="' + esc(i.text) + '"><span class="title">' + esc(i.text) + '</span>' +
      '<span class="sub">' + esc(i.partsText ? i.partsText + " · " : "") + esc(i.recipes.length > 1 ? i.recipes.length + " Rezepte" : i.recipes[0] || "") + '</span></button>' +
      '<button class="btn ghost" style="width:auto;padding:0 4px" data-a="have" data-k="' + esc(i.key) + '" aria-label="' + esc(i.name) + ' habe ich">Habe ich</button></div>';
  }

  // ------------------------------------------------------------------ Ansicht: Vorrat
  function viewVorrat() {
    var groups = K.GRUNDVORRAT.map(function (g) {
      return '<section class="sec"><div class="sec-head"><h2>' + esc(g.gruppe) + '</h2></div><div class="group">' + g.eintraege.map(function (x) {
        var key = K.normName(x[0]); var on = haveKey(key);
        return '<div class="row"><span class="main"><span>' + esc(x[0]) + '</span></span><button class="toggle" role="switch" aria-checked="' + on + '" aria-label="' + esc(x[0]) + ' habe ich" data-a="pantry" data-k="' + esc(key) + '"></button></div>';
      }).join("") + '</div></section>';
    }).join("");
    var std = K.standardVorrat();
    var others = Object.keys(S.pantry).filter(function (k) { return !std[k]; }).sort();
    var other = others.length ? '<section class="sec"><div class="sec-head"><h2>Weitere Zutaten</h2><span class="small muted">aus der Einkaufsliste gemerkt</span></div><div class="group">' + others.map(function (k) {
      var on = !!S.pantry[k].have;
      return '<div class="row"><span class="main"><span>' + esc(k.charAt(0).toUpperCase() + k.slice(1)) + '</span></span><button class="toggle" role="switch" aria-checked="' + on + '" aria-label="' + esc(k) + ' habe ich" data-a="pantry" data-k="' + esc(k) + '"></button></div>';
    }).join("") + '</div></section>' : "";
    return '<header class="topbar"><h1>Vorrat</h1></header>' + guide("vorrat") +
      '<p class="small muted" style="padding-inline:4px">Eingeschaltet heißt: habe ich zu Hause. Diese Zutaten landen nicht auf der Einkaufsliste.</p>' + groups + other;
  }

  // ------------------------------------------------------------------ Ansicht: Hinzufügen
  function viewNeu() {
    var d = UI.draft, ir = UI.importRes;

  function doBackup() {
    if (/claude|claudeusercontent/.test(location.hostname)) { toast("Sichern funktioniert in der installierten App, nicht in dieser Vorschau"); return; }
    var text = backupData(), name = "Rezeptbuch-Sicherung.json";
    var done = function () { S.meta.lastBackup = Date.now(); save("meta"); render(); toast("Gesichert"); };
    try {
      var file = new File([text], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: name }).then(done, function () { /* abgebrochen */ });
        return;
      }
    } catch (e) { /* weiter mit Download */ }
    try {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); done();

  }
  function restore(text) {

      var a = S.recipes[id], b = j.recipes[id];
      if (!a) { S.recipes[id] = b; added++; } else if ((b.updatedAt || 0) > (a.updatedAt || 0)) { S.recipes[id] = b; newer++; }
    });
    Object.keys(j.pantry || {}).forEach(function (k) { var a = S.pantry[k], b = j.pantry[k]; if (!a || (b.at || 0) > (a.at || 0)) S.pantry[k] = b; });
    Object.keys(j.zuord || {}).forEach(function (k) { if (!S.zuord[k]) S.zuord[k] = j.zuord[k]; });

    ["recipes", "pantry", "zuord", "follow"].forEach(save);

  // ------------------------------------------------------------------ Instagram-Export (ZIP oder JSON) lesen
  function readZip(buf) {
    var dv = new DataView(buf), u8 = new Uint8Array(buf), files = [];
    var eocd = -1;
    for (var i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) return Promise.reject(new Error("keine ZIP-Datei"));
    var cnt = dv.getUint16(eocd + 10, true), off = dv.getUint32(eocd + 16, true);
    var dec = new TextDecoder();
    for (var n = 0; n < cnt; n++) {
      var nameLen = dv.getUint16(off + 28, true), extra = dv.getUint16(off + 30, true), comLen = dv.getUint16(off + 32, true);
      var method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true), local = dv.getUint32(off + 42, true);
      var name = dec.decode(u8.subarray(off + 46, off + 46 + nameLen));
      if (/saved_(posts|collections)\.json$/.test(name)) {
        var lnl = dv.getUint16(local + 26, true), lex = dv.getUint16(local + 28, true);
        files.push({ name: name, method: method, data: u8.subarray(local + 30 + lnl + lex, local + 30 + lnl + lex + csize) });
      }
      off += 46 + nameLen + extra + comLen;
    }
    return Promise.all(files.map(function (f) {
      if (f.method === 0) return dec.decode(f.data);
      if (typeof DecompressionStream === "undefined") return Promise.reject(new Error("Entpacken nicht möglich"));
      var ds = new DecompressionStream("deflate-raw");
      return new Response(new Blob([f.data]).stream().pipeThrough(ds)).text();
    }));
  }
  function handleExportFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    toast("Export wird gelesen …");
    Promise.all(files.map(function (f) {
      return f.arrayBuffer().then(function (buf) { return /\.zip$/i.test(f.name) || new Uint8Array(buf, 0, 2)[0] === 0x50 ? readZip(buf) : [new TextDecoder().decode(buf)]; });
    })).then(function (parts) {
      var jsons = [].concat.apply([], parts).map(function (t) { try { return JSON.parse(t); } catch (e) { return null; } }).filter(Boolean);
      if (!jsons.length) throw new Error("keine Daten");
      var posts = K.parseInstagramExport(jsons);
      var recipes = [];
      posts.forEach(function (p) {
        var res = K.analyse({ caption: p.caption, url: p.url, account: p.account, ownerUrl: p.ownerUrl });
        var like = K.recipeLikelihood(res, p.caption, p.url);
        if (like.recipe) recipes.push({ id: p.id, p: p, res: res, like: like });
      });
      var ids = Object.keys(S.recipes);
      var sorted = K.importNeue(ids, recipes);
      UI.importRes = { posts: posts.length, recipes: recipes.length, known: sorted.vorhanden.length, neu: sorted.neu };
      render();
    }).catch(function (e) { toast("Export konnte nicht gelesen werden: " + e.message); });
  }

  // ------------------------------------------------------------------ Teilen aus Instagram (Kurzbefehl) über die Adresse
  // Format: …/#u=<Instagram-Link>&t=<Text der Einbettungsseite oder Caption>
  function readHashImport() {
    var h = location.hash.replace(/^#/, "");
    if (!/(^|&)(t|u)=/.test(h)) return false;
    var p = {}; h.split("&").forEach(function (kv) { var i = kv.indexOf("="); if (i > 0) { try { p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " ")); } catch (e) { /* kaputt */ } } });
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* egal */ }
    var text = p.t || "", url = p.u || "";
    var emb = /Gefällt|Liked by|class="Caption"/.test(text) ? K.parseInstagramEmbed(text) : null;
    var caption = emb ? emb.caption : text;
    var account = emb ? emb.account : (p.a || "");
    startDraft({ caption: caption, url: url, account: account, ocrText: p.o || "", transcript: p.s || "" });
    UI.tab = "neu"; UI.detail = null;
    return true;
  }
  function startDraft(input) {

      case "save-draft":
        var d = UI.draft, nt2 = ($("#dtitle").value || "").trim();
        var out = addRecipe(d.res, { input: d.input });
        if (out.dupe) { toast("Das Rezept ist schon im Rezeptbuch"); UI.draft = null; UI.detail = out.id; render(); break; }
        if (nt2 && nt2 !== d.res.recipe.title) S.recipes[out.id].userTitle = nt2;
        save("recipes"); UI.draft = null; UI.pasteText = ""; UI.detail = out.id; render(); window.scrollTo(0, 0); toast("Gespeichert");
        var acc = d.res.recipe.source.account;
        if (acc) { var fv = K.folgenVorschlag(S.follow, acc); save("follow"); if (fv.fragen) setTimeout(function () { followSheet(acc); }, 500); }
        break;
      case "follow-yes": K.folgenAntwort(S.follow, el.dataset.acc, "gefolgt"); save("follow"); setTimeout(closeSheet, 300); break;
      case "follow-ans": K.folgenAntwort(S.follow, el.dataset.acc, el.dataset.v); save("follow"); closeSheet(); break;
      case "import-commit":
        var n2 = 0; UI.importRes.neu.forEach(function (x) { var o = addRecipe(x.res, { input: { caption: x.p.caption, url: x.p.url, account: x.p.account, ownerUrl: x.p.ownerUrl }, typ: x.like.typ }); if (!o.dupe) n2++; });
        save("recipes"); UI.importRes = null; UI.tab = "rezepte"; render(); toast(n2 + " Rezepte übernommen"); break;
      case "import-drop": UI.importRes = null; render(); break;
      case "backup": doBackup(); break;
    }
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "q") { UI.q = ev.target.value; var pos = ev.target.selectionStart; render(); var q = $("#q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) { /* egal */ } } }
    if (ev.target.id === "paste") UI.pasteText = ev.target.value;
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "expfile") handleExportFiles(ev.target.files);
    if (ev.target.id === "restorefile" && ev.target.files[0]) ev.target.files[0].text().then(restore);
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && $("#layer").innerHTML) closeSheet(); });
  window.addEventListener("hashchange", function () { if (readHashImport()) render(); });

  // ------------------------------------------------------------------ Start
  dbOpen().then(function () {
    return Promise.all(["recipes", "pantry", "shopping", "follow", "zuord", "meta"].map(function (k) { return dbGet(k).then(function (v) { if (v) S[k] = k === "meta" ? Object.assign(S.meta, v) : v; }); }));
  }).then(function () {
    seedExamples();
    readHashImport();
    render();
  });
  if ("serviceWorker" in navigator && /^https:/.test(location.protocol) && !/claude/.test(location.hostname)) {
    try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) { /* offline-Funktion optional */ }
  }
})();
</script>
