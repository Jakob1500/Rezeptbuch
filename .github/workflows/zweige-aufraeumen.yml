# Löscht alte, fertige Arbeitszweige (Inhalt ist in main). Freigabe Jakob 09.11.2026. Läuft nur, wenn diese Datei geändert wird.
name: Alte Zweige löschen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  loeschen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for b in auftrag1-titel b2-und-ernaehrung fehler-ausgeblendet foto-test jakob-26-10 niederlaendisch whatsapp-vorschau wartet-auf-go-a; do
            git push origin --delete "$b" || echo "$b schon weg"
          done
