# Holt den Offline-Übersetzer Bergamot (Mozilla, MPL-2.0) und das Modell Englisch→Deutsch
# einmalig in das Repository (docs/bergamot/). Die iPhones laden ihn dann von GitHub Pages,
# also von derselben Adresse wie die App – keine fremden Server zur Laufzeit.
name: Bergamot-Übersetzer holen
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/bergamot.yml"]
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Übersetzer-Paket laden
        run: |
          set -x
          mkdir -p /tmp/b docs/bergamot
          cd /tmp/b
          npm view @browsermt/bergamot-translator versions --json > versionen.json || true
          npm pack @browsermt/bergamot-translator
          tar xzf browsermt-bergamot-translator-*.tgz
          cd package
          find . -type f -printf "%s %p\n" | sort -k2 > "$GITHUB_WORKSPACE/docs/bergamot/_paket.txt"
          cp ../versionen.json "$GITHUB_WORKSPACE/docs/bergamot/_versionen.json" || true
          cp package.json LICENSE* README* "$GITHUB_WORKSPACE/docs/bergamot/" 2>/dev/null || true
          # Laufzeitdateien (JS + WASM) übernehmen
          find . -type f \( -name "*.wasm" -o -name "*.js" \) ! -path "*/node_modules/*" -exec cp --parents {} "$GITHUB_WORKSPACE/docs/bergamot/" \;
      - name: Modell Englisch→Deutsch laden
        shell: bash
        run: |
          set +e
          Z="$GITHUB_WORKSPACE/docs/bergamot"; L="$Z/_log.txt"
          mkdir -p "$Z/ende"; : > "$L"
          echo "== Weg 1: Liste des Pakets (bergamot.s3.amazonaws.com)" >> "$L"
          curl -sSL -w "\nHTTP %{http_code}\n" https://bergamot.s3.amazonaws.com/models/index.json -o /tmp/index.json >> "$L" 2>&1
          if gzip -t /tmp/index.json 2>/dev/null; then gunzip -c /tmp/index.json > /tmp/i2.json && mv /tmp/i2.json /tmp/index.json; fi
          head -c 1500 /tmp/index.json >> "$L"; echo >> "$L"
          node -e '
            let r; try { r = JSON.parse(require("fs").readFileSync("/tmp/index.json","utf8")); } catch (e) { console.log("kein JSON"); process.exit(0); }
            const e = r.ende || (r.models && r.models.ende); if (!e) { console.log("ende fehlt; Schlüssel: " + Object.keys(r).slice(0,20).join(",")); process.exit(0); }
            Object.values(e).forEach(f => { if (f && f.name) console.log("URL " + f.name); });' > /tmp/urls.txt 2>&1
          cat /tmp/urls.txt >> "$L"
          grep "^URL " /tmp/urls.txt | cut -c5- | while read -r u; do
            curl -sSL -w " HTTP %{http_code} %{size_download}\n" "$u" -o "$Z/ende/$(basename "$u")" >> "$L" 2>&1
          done
          if ! ls "$Z/ende"/model.* >/dev/null 2>&1; then
            echo "== Weg 2: Mozilla firefox-translations-models (Git LFS)" >> "$L"
            GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 https://github.com/mozilla/firefox-translations-models /tmp/m >> "$L" 2>&1
            cd /tmp/m && git lfs install --local >> "$L" 2>&1
            for v in tiny base-memory base prod; do
              if ls models/$v/ende >/dev/null 2>&1; then
                echo "Variante $v" >> "$L"; cat models/$v/ende/metadata.json >> "$L" 2>/dev/null
                git lfs pull --include "models/$v/ende/*" >> "$L" 2>&1
                ls -la models/$v/ende >> "$L"
                if ! grep -q "version https://git-lfs" models/$v/ende/model.*; then cp models/$v/ende/* "$Z/ende/"; break; fi
              fi
            done
            cd "$GITHUB_WORKSPACE"
          fi
          cd "$Z/ende"; for f in *.gz; do [ -e "$f" ] && gunzip -f "$f"; done
          ls -la >> "$L"
          node -e '
            const fs=require("fs"), c=require("crypto"), d=process.argv[1], files=fs.readdirSync(d);
            const teil=n=>n.startsWith("model.")?"model":n.startsWith("lex.")?"lex":n.startsWith("vocab.")?"vocab":null;
            const e={}; files.forEach(n=>{ const t=teil(n); if(!t) return; const b=fs.readFileSync(d+"/"+n); e[t]={ name:"bergamot/ende/"+n, size:b.length, expectedSha256Hash:c.createHash("sha256").update(b).digest("hex") }; });
            fs.writeFileSync(d+"/../registry.json", JSON.stringify({ ende:e }, null, 1)); console.log(JSON.stringify(e));' "$Z/ende" >> "$L" 2>&1
          exit 0
      - name: Ins Repository schreiben
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add docs/bergamot
          git commit -m "Bergamot-Übersetzer und Modell en→de (automatisch geholt)" || echo "nichts Neues"
          git push
