# Holt den Offline-Übersetzer Bergamot (Mozilla, MPL-2.0) und das Modell Englisch→Deutsch
# einmalig in das Repository (docs/bergamot/). Die iPhones laden ihn dann von GitHub Pages,
# also von derselben Adresse wie die App – keine fremden Server zur Laufzeit.
name: Bergamot-Übersetzer holen
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/bergamot.yml"]
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Übersetzer-Paket laden
        run: |
          set -x
          mkdir -p /tmp/b docs/bergamot
          cd /tmp/b
          npm view @browsermt/bergamot-translator versions --json > versionen.json || true
          npm pack @browsermt/bergamot-translator
          tar xzf browsermt-bergamot-translator-*.tgz
          cd package
          find . -type f -printf "%s %p\n" | sort -k2 > "$GITHUB_WORKSPACE/docs/bergamot/_paket.txt"
          cp ../versionen.json "$GITHUB_WORKSPACE/docs/bergamot/_versionen.json" || true
          cp package.json LICENSE* README* "$GITHUB_WORKSPACE/docs/bergamot/" 2>/dev/null || true
          # Laufzeitdateien (JS + WASM) übernehmen
          find . -type f \( -name "*.wasm" -o -name "*.js" \) ! -path "*/node_modules/*" -exec cp --parents {} "$GITHUB_WORKSPACE/docs/bergamot/" \;
      - name: Modell Englisch→Deutsch laden (passend zum Paket)
        run: |
          set -x
          Z="$GITHUB_WORKSPACE/docs/bergamot"
          mkdir -p "$Z/ende" && cd /tmp
          # 1. Weg: die Modell-Liste, auf die das Paket selbst eingestellt ist (garantiert passende Fassung)
          if curl -fsSL https://bergamot.s3.amazonaws.com/models/index.json -o index.json; then
            node -e '
              const r=require("/tmp/index.json"), e=r.ende; if(!e) { console.error("kein ende"); process.exit(1); }
              require("fs").writeFileSync("/tmp/ende.json", JSON.stringify(e,null,1));
              Object.values(e).forEach(f=>{ if(f && f.name) console.log(f.name); });' > urls.txt
            cat urls.txt
            while read -r u; do curl -fsSL "$u" -o "$Z/ende/$(basename "$u")"; done < urls.txt
            echo "Quelle: bergamot.s3.amazonaws.com/models/index.json" > "$Z/_modelle-stand.txt"
          else
            echo "S3-Liste nicht erreichbar" > "$Z/_modelle-stand.txt"
          fi
          cd "$Z/ende"
          for f in *.gz; do [ -e "$f" ] && gunzip -f "$f"; done
          ls -la >> "$Z/_modelle-stand.txt"
          # Eigene Modell-Liste mit Prüfsummen (relativ zur App-Adresse)
          node -e '
            const fs=require("fs"), c=require("crypto"), d=process.argv[1], files=fs.readdirSync(d);
            const teil=n=>/^model\./.test(n)?"model":/^lex\./.test(n)?"lex":/^vocab\./.test(n)?"vocab":/^qualityModel|quality/.test(n)?"qualityModel":null;
            const e={}; files.forEach(n=>{ const t=teil(n); if(!t) return; const b=fs.readFileSync(d+"/"+n); e[t]={ name:"bergamot/ende/"+n, size:b.length, expectedSha256Hash:c.createHash("sha256").update(b).digest("hex") }; });
            fs.writeFileSync(d+"/../registry.json", JSON.stringify({ ende:e }, null, 1));
            console.log(JSON.stringify(e,null,1));' "$Z/ende"
          test -s "$Z/registry.json"
      - name: Ins Repository schreiben
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add docs/bergamot
          git commit -m "Bergamot-Übersetzer und Modell en→de (automatisch geholt)" || echo "nichts Neues"
          git push
